<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Music Emotion Survey</title>

  <!-- jsPsych core -->
  <script src="https://unpkg.com/jspsych@8.3.0"></script>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" />

  <!-- General experiment utilities -->
  <script src="https://unpkg.com/@jspsych/plugin-preload@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-browser-check@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-fullscreen@2.1.0"></script>

  <!-- Instructions and simple response screens -->
  <script src="https://unpkg.com/@jspsych/plugin-instructions@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.2.0"></script>

  <!-- Audio presentation -->
  <script src="https://unpkg.com/@jspsych/plugin-audio-keyboard-response@2.2.0"></script>

  <!-- Survey response formats -->
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-likert@2.2.0"></script>

  <style>
    /* Keep global styling minimal. Add the final UI styles here later. */
    .jspsych-content {
      max-width: 900px;
    }

    /* jsPsych's button display rule otherwise overrides the hidden attribute. */
    #save-retry[hidden] {
      display: none;
    }

    /* Condition 1: emotion-keyword entry */

    .keyword-response {
      width: min(700px, 90vw);
      margin: 0 auto;
      text-align: left;
    }

    .keyword-input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #aeb7c2;
      border-radius: 5px;
      font-size: 18px;
    }

    .keyword-input:focus {
      border-color: #3b73b9;
      outline: 2px solid rgba(59, 115, 185, 0.2);
    }

    .keyword-tags {
      display: flex;
      flex-wrap: wrap;
      min-height: 52px;
      gap: 8px;
      margin: 18px 0;
      padding: 10px;
      border: 1px solid #d5dae0;
      border-radius: 5px;
      background: #f7f8fa;
    }

    .keyword-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border: 1px solid #9db9dc;
      border-radius: 16px;
      background: #eaf2fb;
      color: #173f6d;
    }

    .keyword-remove {
      padding: 0;
      border: 0;
      background: transparent;
      color: #52677d;
      font-size: 17px;
      cursor: pointer;
    }

    .keyword-message {
      min-height: 24px;
      margin-top: 8px;
      color: #b42318;
    }

    .keyword-count {
      color: #606b77;
      font-size: 14px;
    }

    /* Give dimensional endpoint messages room for two lines of whole words. */
    .dimensional-rating {
      width: min(900px, calc(100vw - 40px));
    }

    .dimensional-rating #jspsych-survey-likert-form {
      overflow-x: auto;
    }

    .dimensional-rating .jspsych-survey-likert-opts {
      position: relative;
      display: flex;
      width: calc(100% - 260px);
      min-width: 360px;
      margin-inline: 130px;
    }

    .dimensional-rating .jspsych-survey-likert-opts::before {
      position: absolute;
      top: 8px;
      left: calc(100% / 18);
      width: calc(100% * 8 / 9);
    }

    .dimensional-rating .jspsych-survey-likert-opt-label {
      display: block;
      text-align: center;
      line-height: 1.5;
      word-break: keep-all;
      overflow-wrap: normal;
    }

    .dimensional-rating .dimensional-anchor {
      display: block;
    }

    .dimensional-rating .jspsych-survey-likert-opts li:first-child .dimensional-anchor,
    .dimensional-rating .jspsych-survey-likert-opts li:last-child .dimensional-anchor {
      position: relative;
      left: 50%;
      width: 260px;
      transform: translateX(-50%);
    }

    /* Larger familiarity controls in both conditions, including practice. */
    .familiarity-rating {
      width: min(760px, calc(100vw - 40px));
    }

    .familiarity-rating .jspsych-survey-likert-statement {
      font-size: 20px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .familiarity-rating .jspsych-survey-likert-opts {
      position: relative;
      display: flex;
      width: 100%;
      padding-bottom: 40px;
    }

    /* Keep the connecting line centered behind the enlarged circles. */
    .familiarity-rating .jspsych-survey-likert-opts::before {
      position: absolute;
      top: 12px;
      left: calc(100% / 18);
      width: calc(100% * 8 / 9);
    }

    .familiarity-rating .jspsych-survey-likert-opt-label {
      display: block;
      font-size: 16px;
      line-height: 1.5;
      cursor: pointer;
    }

    .familiarity-rating .jspsych-survey-likert-opts li input[type="radio"] {
      width: 28px;
      height: 28px;
      left: auto;
      margin: 0 auto 12px;
      cursor: pointer;
    }
  </style>
</head>

<body></body>

<script>
  "use strict";

  /* ------------------------------------------------------------------
     1. INITIALIZE JSPSYCH
     ------------------------------------------------------------------ */

  const jsPsych = initJsPsych({
    // Use WebAudio for more precise audio presentation.
    use_webaudio: true,

    // Display overall experiment progress.
    show_progress_bar: true,
    auto_update_progress_bar: true,
    message_progress_bar: "진행률",

    // Do not add an automatic delay between trials.
    // Timing gaps should be defined explicitly within the timeline.
    default_iti: 0,

    // Treat uppercase and lowercase keyboard responses identically.
    case_sensitive_responses: false,

    // Runs when the complete experiment ends.
    on_finish: function () {
      // Keep submission pending until DataPipe confirms the OSF upload.
      return finishSurveyAndSave();
    }
  });

  const timeline = [];

  /* ------------------------------------------------------------------
     2. EXPERIMENT CONFIGURATION
     ------------------------------------------------------------------ */

  // Language for Condition 2's dimensional questions and anchors only.
  const lang = "kor"; // "eng" or "kor"

  const experimentConfig = {
    // Change manually when testing the other condition.
    condition: "condition_2",

    audioFiles: [
      "audio/0001.mp3",
      "audio/0002.mp3",
      "audio/0003.mp3"
    ],
    calibrationAudioFile: "audio/calibration.mp3",
    practiceAudioFile: "audio/practice.mp3"
  };

  // Generate one identifier for this survey run.
  const sessionId = jsPsych.randomization.randomID(16);

  // Change this when you revise the experiment.
  const experimentVersion = "ccm_draft_04";

  // Attach these fields to every trial row.
  jsPsych.data.addProperties({
    session_id: sessionId,
    condition: experimentConfig.condition,
    experiment_version: experimentVersion,
    session_started_at: new Date().toISOString()
  });

  const dataSavingConfig = {
    // This public experiment ID is not an OSF credential.
    endpoint: "https://pipe.jspsych.org/api/data/",
    experimentID: "FwC3YmrlfInI",

    // Maximum time to wait for each upload attempt.
    timeoutMs: 30000,
    retryDelayMs: 5000
  };

  // Retrieved before timeline assembly; not applied to the experiment yet.
  let retrievedConditionNumber;

  async function retrieveConditionNumber() {
    if (
      typeof dataSavingConfig.experimentID !== "string" ||
      !/^[A-Za-z0-9]+$/.test(dataSavingConfig.experimentID)
    ) {
      throw new Error("CONDITION_EXPERIMENT_ID_INVALID");
    }

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 30000);

    try {
      // DataPipe must have sequential assignment enabled with two conditions.
      // Request once: another request would consume the next assignment.
      const response = await fetch("https://pipe.jspsych.org/api/condition/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ experimentID: dataSavingConfig.experimentID }),
        signal: controller.signal
      });

      if (response.status !== 200) {
        throw new Error("CONDITION_HTTP_ERROR");
      }

      const result = await response.json();
      if (result?.error != null || ![0, 1].includes(result?.condition)) {
        throw new Error("CONDITION_RESPONSE_INVALID");
      }

      return result.condition;
    } finally {
      clearTimeout(timeout);
    }
  }

  // One completion operation per page session, including failed attempts.
  let submissionPromise = null;

  function submissionError(code, state = "rejected", httpStatus = null) {
    return Object.assign(new Error(code), {
      submissionCode: code,
      submissionState: state,
      httpStatus
    });
  }

  function submissionErrorText(error) {
    // Never display raw exception/server messages: they may contain response data.
    const code = error?.submissionCode || "SAVE_UNEXPECTED";
    const http = Number.isInteger(error?.httpStatus) ? ` (HTTP ${error.httpStatus})` : "";
    return `오류 코드: ${code}${http}`;
  }

  // Only known, public API codes may appear on the participant's screen.
  // Unrecognized server errors get SAVE_REMOTE_UNKNOWN, not raw response text.
  const dataPipeErrorCodes = new Set([
    "MISSING_PARAMETER", "EXPERIMENT_NOT_FOUND", "EXPERIMENT_DATA_NOT_FOUND",
    "DATA_COLLECTION_NOT_ACTIVE", "BASE64DATA_COLLECTION_NOT_ACTIVE",
    "CONDITION_ASSIGNMENT_NOT_ACTIVE", "SESSION_LIMIT_REACHED",
    "INVALID_DATA", "INVALID_BASE64_DATA", "USER_DATA_NOT_FOUND", "INVALID_OWNER",
    "INVALID_OSF_TOKEN", "INVALID_REFRESH_TOKEN", "NOT_USING_OAUTH",
    "OAUTH_NOT_SETUP", "TOKEN_RESOLUTION_ERROR", "OSF_FILE_EXISTS",
    "OSF_UPLOAD_ERROR", "OSF_UPLOAD_EXCEPTION", "INVALID_METADATA_ERROR",
    "OSF_METADATA_UPLOAD_ERROR", "METADATA_ERROR", "DATA_PERSIST_ERROR",
    "UNKNOWN_ERROR_GETTING_CONDITION"
  ]);

  function validateDataSavingConfig() {
    if (dataSavingConfig.endpoint !== "https://pipe.jspsych.org/api/data/") {
      throw submissionError("SAVE_CONFIG_ENDPOINT");
    }
    if (
      typeof dataSavingConfig.experimentID !== "string" ||
      !/^[A-Za-z0-9]+$/.test(dataSavingConfig.experimentID)
    ) {
      throw submissionError("SAVE_CONFIG_EXPERIMENT_ID");
    }
    if (!Number.isInteger(dataSavingConfig.timeoutMs) || dataSavingConfig.timeoutMs <= 0) {
      throw submissionError("SAVE_CONFIG_TIMEOUT");
    }
    if (!Number.isInteger(dataSavingConfig.retryDelayMs) || dataSavingConfig.retryDelayMs < 5000) {
      throw submissionError("SAVE_CONFIG_RETRY_DELAY");
    }
    if (typeof fetch !== "function") {
      throw submissionError("SAVE_BROWSER_FETCH");
    }
    if (typeof AbortController !== "function") {
      throw submissionError("SAVE_BROWSER_ABORT");
    }
    if (typeof TextEncoder !== "function") {
      throw submissionError("SAVE_BROWSER_ENCODING");
    }
  }

  // Validate local settings before any trials. Remote setup requires a pilot.
  try {
    validateDataSavingConfig();
  } catch (error) {
    document.body.textContent =
      "응답 저장 설정을 확인할 수 없어 실험을 시작할 수 없습니다. 연구자에게 문의해 주세요. " +
      submissionErrorText(error);
    throw error;
  }

  /* ------------------------------------------------------------------
     3. WORKFLOW SECTIONS

     Each function returns an array of jsPsych trials. Add the relevant
     trial objects after the participant-facing text has been finalized.
     ------------------------------------------------------------------ */

  function buildConsentAndEligibility() {
    // Suggested plugin: jsPsychSurveyHtmlForm
    const consent = {
      type: jsPsychSurveyHtmlForm,

      preamble: `
        <div class="survey-section">
          <h2>[연구 참여 동의 제목]</h2>
          <div class="information-text">
            [연구 설명 및 동의서 내용을 입력하세요.]
          </div>
        </div>
      `,

      html: `
        <fieldset>
          <legend>[연구 참여 동의 여부를 선택해 주세요.]</legend>

          <label>
            <input
              type="radio"
              name="consent_decision"
              value="agree"
              required
            >
            [동의함]
          </label>

          <label>
            <input
              type="radio"
              name="consent_decision"
              value="decline"
              required
            >
            [동의하지 않음]
          </label>
        </fieldset>
      `,

      button_label: "[다음]",

      data: {
        task: "consent"
      },

      on_finish: function (data) {
        const consented =
          data.response.consent_decision === "agree";

        data.consented = consented;

        if (!consented) {
          jsPsych.abortExperiment(
            "[연구 참여에 동의하지 않아 실험이 종료되었습니다.]"
          );
        }
      }
    };

    const eligibility = {
      type: jsPsychSurveyHtmlForm,

      preamble: `
        <div class="survey-section">
          <h2>[참여 조건 확인 제목]</h2>
          <p>[참여 조건을 확인하기 위한 안내문을 입력하세요.]</p>
        </div>
      `,

      html: `
        <fieldset>
          <legend>[참여 조건 질문 1]</legend>

          <label>
            <input
              type="radio"
              name="eligibility_1"
              value="yes"
              required
            >
            [예]
          </label>

          <label>
            <input
              type="radio"
              name="eligibility_1"
              value="no"
              required
            >
            [아니요]
          </label>
        </fieldset>

        <fieldset>
          <legend>[참여 조건 질문 2]</legend>

          <label>
            <input
              type="radio"
              name="eligibility_2"
              value="yes"
              required
            >
            [예]
          </label>

          <label>
            <input
              type="radio"
              name="eligibility_2"
              value="no"
              required
            >
            [아니요]
          </label>
        </fieldset>
      `,

      button_label: "다음",

      data: {
        task: "eligibility"
      },

      on_finish: function (data) {
        const eligible =
          data.response.eligibility_1 === "yes" &&
          data.response.eligibility_2 === "yes";

        data.eligible = eligible;

        if (!eligible) {
          jsPsych.abortExperiment(
            "참여 조건에 해당하지 않아 실험이 종료되었습니다."
          );
        }
      }
    };

    return [consent, eligibility];

  }

  function buildHeadphoneCheckAndCalibration() {
    // Suggested plugins:
    // jsPsychHtmlButtonResponse, jsPsychAudioKeyboardResponse,
    // jsPsychSurveyHtmlForm
    const headphoneConfirmation = {
      type: jsPsychSurveyHtmlForm,

      preamble: `
          <div class="survey-section">
            <h2>헤드폰 착용 확인</h2>
            <p>본 실험은 음악을 듣고 느껴지는 감정을 보고하는 실험으로, 실험 진행을 위해 헤드폰 혹은 이어폰 착용이 필요합니다.</p>
          </div>
        `,

      html: `
          <p>헤드폰 혹은 이어폰을 착용하였다면 [다음]을 눌러 진행해주세요</p>
        `,

      button_label: "다음",

      data: {
        task: "headphone_confirmation"
      }
    };

    const calibrationInstructions = {
      type: jsPsychHtmlButtonResponse,

      stimulus: `
          <div class="survey-section">
            <h2>음량 조절</h2>
            <p>[시작하기]를 눌러 음악이 재생되면 장치의 볼륨을 적절한 수준으로 조절해주세요</p>
          </div>
        `,

      choices: ["시작하기"],

      data: {
        task: "calibration_instructions"
      }
    };

    let calibrationPlayer = null;
    let calibrationActive = false;
    const calibrationConfirmation = {
      type: jsPsychSurveyHtmlForm,

      preamble: `
          <p id="calibration-playing" hidden>음악이 재생중입니다</p>
          <p>듣기 편한 음량으로 조절해주세요</p>
          <p>음량 조절이 완료되었으면 [확인]을 눌러 다음으로 넘어가세요</p>
        `,

      html: `
          <audio id="calibration-audio" loop preload="auto"></audio>
          <input type="hidden" name="calibration_decision" value="continue">
        `,

      button_label: "확인",

      data: {
        task: "calibration_confirmation",
        audio_file: experimentConfig.calibrationAudioFile
      },

      on_load: function () {
        const display = jsPsych.getDisplayElement();
        const confirm = display.querySelector("input[type='submit']");
        const playing = display.querySelector("#calibration-playing");
        calibrationPlayer = display.querySelector("#calibration-audio");
        calibrationActive = true;
        confirm.disabled = true;

        function failCalibration() {
          if (!calibrationActive) return;
          calibrationActive = false;
          calibrationPlayer.pause();
          // Reuse the existing audio-loading error; never proceed without sound.
          jsPsych.abortExperiment(preloadCalibration.error_message);
        }

        calibrationPlayer.addEventListener("error", failCalibration, { once: true });
        calibrationPlayer.src = experimentConfig.calibrationAudioFile;
        calibrationPlayer.play().then(() => {
          if (!calibrationActive) return;
          playing.hidden = false;
          confirm.disabled = false;
        }).catch(failCalibration);
      },

      on_finish: function () {
        calibrationActive = false;
        calibrationPlayer.pause();
      }
    };

    const preloadCalibration = {
      type: jsPsychPreload,

      audio: [experimentConfig.calibrationAudioFile],

      max_load_time: 60000,
      continue_after_error: false,
      show_detailed_errors: false,

      message: "<p>음량 조절용 소리를 불러오고 있습니다.</p>",

      error_message: `
    <p>소리를 불러오지 못했습니다.</p>
    <p>인터넷 연결을 확인한 뒤 연구자에게 문의해 주세요.</p>
  `,

      data: {
        task: "calibration_preload"
      }
    };

    return [
      headphoneConfirmation,
      preloadCalibration,
      calibrationInstructions,
      calibrationConfirmation
    ];
  }

  function buildIntroductionAndPractice() {
    // 1. VALIDATE THE ASSIGNED CONDITION AND PRACTICE FILE
    // The condition must already be assigned before timeline assembly.
    const condition = experimentConfig.condition;
    const practiceFile = experimentConfig.practiceAudioFile;

    if (!["condition_1", "condition_2"].includes(condition)) {
      throw new Error(
        "Assign condition_1 or condition_2 before building practice."
      );
    }

    if (typeof practiceFile !== "string" || !practiceFile.trim()) {
      throw new Error("Set experimentConfig.practiceAudioFile.");
    }

    if (experimentConfig.audioFiles.includes(practiceFile)) {
      throw new Error(
        "Use a practice file outside the main audioFiles list."
      );
    }

    // 2. SHOW INSTRUCTIONS ONLY FOR THE ASSIGNED RESPONSE FORMAT
    // All Korean text below is editable draft wording.
    // No emotion examples are supplied to the free-response group.
    const conditionPages = {
      condition_1: [
        `
            <h2>감정 단어 입력</h2>
            <p>음악을 듣는 동안 실제로 느낀 감정을 한 단어씩 입력해 주세요.</p>
            <p>단어를 입력한 뒤 Enter를 누르면 화면에 추가됩니다.</p>
            <p>다른 감정도 같은 방법으로 입력할 수 있습니다.</p>
          `,
        `
            <h2>입력한 단어 확인</h2>
            <p>입력한 단어는 화면에서 확인할 수 있습니다.</p>
            <p>지우려면 단어 옆의 ×를 눌러 주세요.</p>
            <p>한 개 이상의 단어를 추가하고 입력란을 비운 뒤 응답 완료를 눌러 주세요.</p>
          `
      ],

      condition_2: [
        `
            <h2>느낌 평가</h2>
            <p>음악을 듣는 동안 실제로 느낀 상태를 각 문장에 대해 평가해 주세요.</p>
            <p>화면에 표시된 기준을 보고 1부터 9까지 중 하나를 선택해 주세요.</p>
          `,
        `
            <h2>응답 확인</h2>
            <p>각 문장마다 하나의 응답을 선택해 주세요.</p>
            <p>제출 전에는 선택을 바꿀 수 있습니다.</p>
            <p>화면 아래에도 문항이 있으면 내려서 확인해 주세요.</p>
            <p>모든 문항에 답한 뒤 응답 완료를 눌러 주세요.</p>
          `
      ]
    };

    const instructions = {
      type: jsPsychInstructions,

      pages: [
        `
            <h2>실험 안내</h2>
            <p>5초 길이의 음악을 듣고 자신의 느낌에 답하는 실험입니다.</p>
            <p>음악 재생이 끝나면 응답 화면이 나타납니다.</p>
            <p>정답은 없으니 자신의 느낌대로 답해 주세요.</p>
          `,

        // Insert only the assigned condition's instruction pages.
        ...conditionPages[condition],

        `
            <h2>친숙도와 연습</h2>
            <p>느낌에 대한 응답을 마치면 음악이 얼마나 친숙했는지 답해 주세요.</p>
            <p>먼저 연습용 음악으로 이 과정을 연습합니다.</p>
            <p>연습이 끝나면 필요한 만큼 다시 연습하거나 본 실험을 시작할 수 있습니다.</p>
          `
      ],

      show_clickable_nav: true,
      allow_backward: true,
      allow_keys: false,

      button_label_previous: "이전",
      button_label_next: "다음",

      post_trial_gap: 0,

      data: {
        task: "instructions",
        phase: "practice",
        condition: condition
      }
    };

    // 3. REUSE THE ASSIGNED CONDITION'S ACTUAL TRIAL BUILDER
    // A separate builder call creates fresh trial objects and response state.
    const buildAssignedTrials = condition === "condition_1"
      ? buildCondition1Trials
      : buildCondition2Trials;

    const [preloadPractice, ...practiceTrials] = buildAssignedTrials({
      audioFiles: [practiceFile],
      phase: "practice"
    });

    // Prevent an old builder that ignores these arguments from accidentally
    // using the main-session audio files for practice.
    if (
      preloadPractice?.type !== jsPsychPreload ||
      preloadPractice.audio?.length !== 1 ||
      preloadPractice.audio[0] !== practiceFile ||
      preloadPractice.data?.phase !== "practice" ||

      if (Array.isArray(node.timeline)) {
        return {
          ...node,
          timeline: node.timeline.map(addAttemptNumber)
        };
      }

      const originalOnFinish = node.on_finish;

      return {
        ...node,

        on_finish: function (data) {
          // Preserve keyword saving, rating conversion, and other existing work.
          if (typeof originalOnFinish === "function") {
            originalOnFinish.call(this, data);
          }

          data.practice_attempt = practiceAttempt;
        }
      };
    }

    const startAttempt = {
      type: jsPsychHtmlButtonResponse,

      stimulus: `
          <h2>연습</h2>
          <p>준비가 되면 연습 시작을 눌러 주세요.</p>
        `,

      choices: ["연습 시작"],
      post_trial_gap: 0,

      data: {
        task: "practice_start",
        phase: "practice",
        condition: condition
      },

      on_start: function () {
        // A trial's on_start runs on every pass through the practice loop.
        practiceAttempt += 1;
      },

      on_finish: function (data) {
        data.practice_attempt = practiceAttempt;
      }
    };

    const repeatDecision = {
      type: jsPsychHtmlButtonResponse,

      stimulus: `
          <h2>연습을 마쳤습니다.</h2>
          <p>같은 음악으로 다시 연습하거나 본 실험을 시작할 수 있습니다.</p>
        `,

      choices: ["다시 연습하기", "본 실험 시작"],
      post_trial_gap: 0,

      data: {
        task: "practice_decision",
        phase: "practice",
        condition: condition
      },

      on_finish: function (data) {
        data.practice_attempt = practiceAttempt;

        // jsPsych numbers buttons from zero: the first button requests a repeat.
        data.repeat_practice = data.response === 0;
      }
    };

    // At least one complete attempt is required. There is no repetition limit.
    const practiceLoop = {
      timeline: [
        startAttempt,
        ...practiceTrials.map(addAttemptNumber),
        repeatDecision
      ],

      loop_function: function (data) {
        // Examine the decision from this iteration only.
        const decision = data
          .filter({ task: "practice_decision" })
          .last(1)
          .values()[0];

        return decision.repeat_practice === true;
      }
    };

    // Instructions and audio preloading run once.
    // Only the complete practice cycle repeats.
    // On exit, jsPsych continues into the existing main-session timeline.
    return [instructions, preloadPractice, practiceLoop];
  }

  function buildCondition1Trials({

    /* ---------------------------------------------------------------
      1. CONFIGURATION VALIDATION
      --------------------------------------------------------------- */

    if (experimentConfig.condition !== "condition_1") {
      throw new Error(
        'buildCondition1Trials() can only be used with "condition_1".'
      );
    }

    if (
      !Array.isArray(audioFiles) ||
      audioFiles.length === 0
    ) {
      throw new Error(
        "audioFiles must contain at least one audio file."
      );
    }

    const invalidAudioFiles = audioFiles.filter(
      function (audioFile) {
        return (
          typeof audioFile !== "string" ||
          audioFile.trim() === ""
        );
      }
    );

    if (invalidAudioFiles.length > 0) {
      throw new Error(
        "Every item in experimentConfig.audioFiles must be a valid string."
      );
    }


    /* ---------------------------------------------------------------
      2. CONSTRUCT TIMELINE VARIABLES
      --------------------------------------------------------------- */

    const condition1Stimuli =
      audioFiles.map(
        function (audioFile, index) {
          const fileName = audioFile.split("/").pop();

          const stimulusId = fileName.replace(

          );

            audioFile: audioFile,

      class="keyword-tags"
      role="list"
      aria-label="입력한 감정 단어"
    ></div>

    <div

      class="keyword-count"

    ></div>

    <div
      id="emotion-keyword-message"
      class="keyword-message"
      aria-live="polite"

      choices: ["응답 완료"],

      data: {
        task: "free_response",
        phase: phase,

      on_start: function () {

        );

        const continueButton = display.querySelector(
          ".jspsych-btn"
        );


        function normalizeKeyword(value) {
          return value
            .trim()
            .replace(/\s+/g, " ");
        }


        function keywordsAreEqual(first, second) {
          return first.localeCompare(
            second,
            "ko",

              sensitivity: "base"
            }
          ) === 0;
        }

          const hasSubmittedKeyword =
            emotionKeywords.length > 0;

            normalizeKeyword(input.value) !== "";

            hasUnsubmittedText;

        function renderKeywords() {
          tagsContainer.replaceChildren();

          emotionKeywords.forEach(
            function (keyword, index) {
              const tag = document.createElement("span");

                      performance.now() -
                      responseScreenStart

                  });

                  renderKeywords();
                  input.focus();

              );

              tag.append(
                keywordText,
                removeButton
              );

              tagsContainer.appendChild(tag);
            }
          );

            `입력한 감정 수 ${emotionKeywords.length}`;

          const keyword =
            normalizeKeyword(input.value);

          if (keyword === "") {
            return;
          }

          const duplicateExists =
            emotionKeywords.some(
              function (existingKeyword) {
                return keywordsAreEqual(
                  existingKeyword,
                  keyword
                );
              }
            );

          if (duplicateExists) {
            messageDisplay.textContent =

            return;
          }

          emotionKeywords.push(keyword);

          keywordEvents.push({
            action: "add",
            keyword: keyword,
            rt: Math.round(
              performance.now() -
              responseScreenStart
            )
          });

          input.value = "";
          messageDisplay.textContent = "";

          renderKeywords();

          "keydown",
          function (event) {

            updateContinueButton();

            "",
            "",
            "",
            "",
            "",
            "",
            "",
            "매우 친숙함"
          ],

          required: true
        }
      ],

      randomize_question_order: false,

      button_label: "다음",

      data: {
        task: "familiarity",
        phase: phase,
        condition: "condition_1",

        stimulus_id:
          jsPsych.timelineVariable("stimulusId"),

        source_index:
          jsPsych.timelineVariable("sourceIndex"),

        audio_file:
          jsPsych.timelineVariable("audioFile")

      randomize_order: true,

      repetitions: 1
    };

      8. RETURN THE COMPLETE CONDITION
      --------------------------------------------------------------- */

    return [
      preloadCondition1Audio,
      condition1Procedure
    ];
  }

          // Save the actual prompts and anchors to document this draft's meaning.
          rating_schema: items.map(item => ({
            id: item.id,
            prompt: item.prompt,
            labels: [...item.labels]
          }))
        },

        on_finish: function (data) {
          // jsPsych stores positions as 0–8. Retain those raw responses and
          // also save named 1–9 columns that are convenient in a CSV export.
          for (const item of items) {
            const raw = data.response?.[item.id];

            // Match Condition 1's familiarity column for comparison later.
            const column = task === "familiarity"
              ? "familiarity_rating_1_to_9"
              : "rating_" + item.id;

            data[column] =
              Number.isInteger(raw) && raw >= 0 && raw <= 8
                ? raw + 1
                : null;
          }

          // The plugin's rt is submission time for the entire page, not per item.
        }
      };
    }

    // 4. PRELOAD AND DETERMINE EXCERPT ORDER
    const preload = {
      type: jsPsychPreload,

      audio: [...audioFiles],
      continue_after_error: false,

      // Loading timeout only; not listening duration.
      max_load_time: 60000,

      message: settings.text.loading,
      error_message: settings.text.loadError,
      post_trial_gap: 0,

      data: {
        task: "preload",
        phase: phase,
        condition: "condition_2"
      }
    };

    const stimuli = audioFiles.map((audioFile, index) => ({
      audioFile: audioFile,

      // Example: "audio/0001.mp3" becomes "0001".
      stimulusId: audioFile
        .split("/")
        .pop()
        .replace(/\.[^/.]+$/, ""),

      // Original position in audioFiles.
      sourceIndex: index + 1
    }));

    const orderedStimuli = randomizeOrder
      ? jsPsych.randomization.shuffle(stimuli)
      : stimuli;

    // 5. REPEAT: LISTEN -> DIMENSIONS -> FAMILIARITY
    // Each excerpt gets separate trial objects and matching identifiers.
    const trials = [preload];

    orderedStimuli.forEach((stimulus, index) => {
      const metadata = {
        condition: "condition_2",
        phase: phase,
        rating_scheme_version: settings.version,
        stimulus_id: stimulus.stimulusId,
        audio_file: stimulus.audioFile,
        source_index: stimulus.sourceIndex,

        // Actual presentation position after shuffling.
        excerpt_number: index + 1
      };

      const listening = {
        type: jsPsychAudioKeyboardResponse,

        stimulus: stimulus.audioFile,
        prompt: settings.text.listening,

        choices: "NO_KEYS",
        response_ends_trial: false,
        trial_ends_after_audio: true,
        post_trial_gap: 0,

        data: {
          ...metadata,
          task: "excerpt_listening"
        }

        // Use prepared five-second files. This plays the entire file and then
        // advances; it neither trims a longer file nor supplies replay controls.
      };

      const ratings = makeRatingPage(
        dimensions,
        settings.text.ratingPreamble,
        settings.text.submitRatings,
        "dimensional_rating",
        metadata
      );

      const familiarityRating = makeRatingPage(
        familiarity,
        settings.text.familiarityPreamble,
        settings.text.submitFamiliarity,
        "familiarity",
        metadata
      );

      // Edit this one line if the within-excerpt sequence changes later.
      trials.push(listening, ratings, familiarityRating);
    });

    return trials;
  }

  async function uploadCompletedSession(requestBody) {
    validateDataSavingConfig();

    // Aborting our wait does not cancel a file already received by DataPipe.
    const controller = new AbortController();

    const timeout = setTimeout(
      () => controller.abort(),
      dataSavingConfig.timeoutMs
    );

    try {
      let response;
      try {
        response = await fetch(dataSavingConfig.endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: requestBody,
          signal: controller.signal,
          credentials: "omit",
          redirect: "error"
        });
      } catch (error) {
        // Fetch cannot distinguish offline, DNS, CORS, or blocked redirects.
        throw submissionError(
          controller.signal.aborted ? "SAVE_REQUEST_TIMEOUT" : "SAVE_CONNECTION",
          "unconfirmed"
        );
      }

      // HTTP 202 is accepted/queued, not confirmation of storage on OSF.
      if (response.status === 202) {
        throw submissionError("SAVE_QUEUED", "queued", response.status);
      }
      // A conflict must block retries even if the response body is unreadable.
      if (response.status === 409) {
        throw submissionError("SAVE_HTTP_CONFLICT", "duplicate", response.status);
      }

      let confirmation;
      try {
        confirmation = await response.json();
      } catch (error) {
        const rejected = response.status >= 400 && response.status < 500 &&
          ![408, 429].includes(response.status);
        const code = controller.signal.aborted ? "SAVE_RESPONSE_TIMEOUT" :
          error?.name === "SyntaxError" ? "SAVE_RESPONSE_JSON" : "SAVE_RESPONSE_READ";
        throw submissionError(code, rejected ? "rejected" : "unconfirmed", response.status);
      }

      if (confirmation?.error === "OSF_UPLOAD_QUEUED" || confirmation?.queued === true) {
        throw submissionError("SAVE_QUEUED", "queued", response.status);
      }
      if (confirmation?.error === "OSF_FILE_EXISTS") {
        throw submissionError("DP_OSF_FILE_EXISTS", "duplicate", response.status);
      }

      // DataPipe's successful OSF write returns 201 and this exact message.
      // It does not echo session_id. Never infer success from HTTP alone.
      if (
        response.status === 201 &&
        confirmation?.message === "Success" &&
        !Object.prototype.hasOwnProperty.call(confirmation, "error")
      ) {
        return;
      }

      // Explicit configuration/validation errors need researcher intervention.
      // Transient transport/service errors may be retried with the same body.
      const transientError = ["OSF_UPLOAD_ERROR", "OSF_UPLOAD_EXCEPTION"]
        .includes(confirmation?.error);
      const explicitError = typeof confirmation?.error === "string";
      const rejected = (explicitError && !transientError) ||
        (!transientError && response.status >= 400 && response.status < 500 &&
          ![408, 429].includes(response.status));
      if (explicitError) {
        const code = dataPipeErrorCodes.has(confirmation.error) ?
          `DP_${confirmation.error}` : "SAVE_REMOTE_UNKNOWN";
        throw submissionError(code, rejected ? "rejected" : "unconfirmed", response.status);
      }
      if (response.status >= 400) {
        throw submissionError("SAVE_HTTP_ERROR", rejected ? "rejected" : "unconfirmed", response.status);
      }
      throw submissionError("SAVE_CONFIRMATION", "unconfirmed", response.status);
    } finally {
      clearTimeout(timeout);
    }
  }

  function finishSurveyAndSave() {
    if (submissionPromise !== null) return submissionPromise;

    let rows;
    try {
      rows = jsPsych.data.get().values();
      if (!Array.isArray(rows) || rows.some(row => row === null || typeof row !== "object")) {
        throw submissionError("SAVE_DATA_READ");
      }
    } catch (error) {
      jsPsych.getDisplayElement().textContent =
        "응답을 읽지 못해 제출하지 못했습니다. 창을 닫거나 새로고침하지 말고 연구자에게 문의해 주세요. " +
        submissionErrorText(submissionError("SAVE_DATA_READ")) +
        ` / 참여 번호: ${sessionId}`;
      submissionPromise = new Promise(() => {});
      return submissionPromise;
    }
    const finalRow = rows[rows.length - 1];

    // abortExperiment() also triggers initJsPsych's on_finish.
    // Submit only consented sessions that completed the debrief.
    const consented = rows.some(
      row => row.task === "consent" && row.consented === true
    );

    if (
      !consented ||
      finalRow?.task !== "debrief" ||
      finalRow.debrief_acknowledged !== true
    ) {
      return;
    }

    let resolveSubmission;
    submissionPromise = new Promise(resolve => { resolveSubmission = resolve; });

    const display = jsPsych.getDisplayElement();

    display.innerHTML = `
    <h2>응답 제출</h2>

    <p id="save-status" role="status" aria-live="polite"></p>
    <p id="save-error" role="status" aria-live="polite"></p>
    <p id="save-files" role="status" aria-live="polite"></p>
    <p id="save-reference"></p>

    <button
      id="save-retry"
      class="jspsych-btn"
      type="button"
      hidden
    >
      다시 제출
    </button>
  `;

    const status = display.querySelector("#save-status");
    const diagnostic = display.querySelector("#save-error");
    const retry = display.querySelector("#save-retry");
    display.querySelector("#save-reference").textContent = `문의 시 알려 주실 참여 번호: ${sessionId}`;

    const files = [];
    let preparationFormat = "JSON";
    let preparationCode = "SAVE_DATA_SERIALIZE";
    try {
      // Both formats use one snapshot; exporting must not modify collected rows.
      const snapshot = jsPsych.data.get().readOnly();
      const completedAt = new Date().toISOString();
      const dataString = JSON.stringify({
        session_id: sessionId,
        experiment_version: experimentVersion,
        condition: experimentConfig.condition,
        completed_at: completedAt,
        trials: snapshot.values()
      });

      preparationFormat = "CSV";
      preparationCode = "SAVE_CSV_SERIALIZE";
      // Nested responses/keyword arrays remain JSON text inside CSV cells.
      // Only the export copy receives the completion-time column.
      snapshot.addToAll({ completed_at: completedAt });
      const csvString = snapshot.csv();

      // Prepare and size-check BOTH immutable requests before sending either.
      for (const [format, data] of [["JSON", dataString], ["CSV", csvString]]) {
        preparationFormat = format;
        preparationCode = "SAVE_REQUEST_SERIALIZE";
        const requestBody = JSON.stringify({
          experimentID: dataSavingConfig.experimentID,
          filename: `CCM_${experimentVersion}_${sessionId}.${format.toLowerCase()}`,
          data
        });
        preparationCode = "SAVE_REQUEST_ENCODING";
        if (new TextEncoder().encode(requestBody).byteLength >= 32000000) {
          throw submissionError("SAVE_REQUEST_TOO_LARGE");
        }
        files.push({ format, requestBody, state: "pending" });
      }
    } catch (error) {
      status.textContent =
        "응답 파일을 준비하지 못해 제출하지 못했습니다. 창을 닫거나 새로고침하지 말고 연구자에게 문의해 주세요.";
      diagnostic.textContent = `${preparationFormat} / ` + submissionErrorText(
        error?.submissionCode ? error : submissionError(preparationCode)
      );
      return submissionPromise;
    }

    let state = "ready";
    function updateFileStatus() {
      const labels = {
        pending: "전송 전", uploading: "전송 중", saved: "저장 확인됨",
        queued: "대기 중 · 저장 미확인", duplicate: "파일 충돌 · 확인 필요",
        unconfirmed: "저장 미확인", rejected: "제출 실패"
      };
      display.querySelector("#save-files").textContent = files
        .map(file => `${file.format}: ${labels[file.state]}`).join(" / ");
    }
    updateFileStatus();

    async function submit() {
      // A single request at a time; terminal states cannot submit again.
      if (state !== "ready") return;
      state = "uploading";
      retry.hidden = true;
      retry.disabled = true;
      diagnostic.textContent = "";
      status.textContent = "응답을 제출하고 있습니다. 창을 닫거나 새로고침하지 말아 주세요.";

      let activeFile;
      try {
        // Stop at the first failure. A manual retry skips confirmed files.
        for (const file of files) {
          if (file.state === "saved") continue;
          activeFile = file;
          file.state = "uploading";
          updateFileStatus();
          await uploadCompletedSession(file.requestBody);
          file.state = "saved";
          updateFileStatus();
        }
        state = "saved";
        status.textContent = "응답이 JSON 및 CSV 파일로 모두 저장되었습니다. 참여해 주셔서 감사합니다.";
        resolveSubmission();
      } catch (error) {
        state = error?.submissionState || "rejected";
        if (activeFile) activeFile.state = state;
        updateFileStatus();
        diagnostic.textContent = `${activeFile?.format || "UPLOAD"} / ` + submissionErrorText(error);
        const keepOpen = " 창을 닫거나 새로고침하지 말고 위 참여 번호로 연구자에게 문의해 주세요.";

        if (state === "queued") {
          status.textContent =
            "전송이 대기 중이며 OSF 저장은 아직 확인되지 않았습니다. 중복 제출하지 말아 주세요." + keepOpen;
        } else if (state === "duplicate") {
          status.textContent =
            "같은 이름의 파일이 있지만 이번 응답과 일치하는지 확인하지 못했습니다. 추가 제출을 중단했습니다." + keepOpen;
        } else if (state === "unconfirmed") {
          status.textContent =
            "저장을 확인하지 못했습니다. 이미 서버에 전달되었을 수도 있습니다. " +
            `인터넷 연결을 확인하고 ${Math.ceil(dataSavingConfig.retryDelayMs / 1000)}초 후 같은 응답으로 다시 제출할 수 있습니다.` + keepOpen;
          retry.hidden = false;
          // This timer only enables a button; it never sends another request.
          setTimeout(() => {
            state = "ready";
            retry.disabled = false;
          }, dataSavingConfig.retryDelayMs);
        } else {
          status.textContent = "제출에 실패했습니다. 저장 설정 또는 응답 파일 확인이 필요합니다." + keepOpen;
        }
      }
    }

    retry.addEventListener("click", submit);
    submit();
    return submissionPromise;
  }

  /* ------------------------------------------------------------------
     4. ASSEMBLE THE TIMELINE
     ------------------------------------------------------------------ */


  async function startExperiment() {
    try {
      retrievedConditionNumber = await retrieveConditionNumber();
    } catch (error) {
      document.body.innerHTML = `
        <h2>실험을 시작할 수 없습니다.</h2>
        <p>실험 조건 번호를 가져오지 못했습니다. 연구자에게 문의해 주세요.</p>
      `;
      throw error;
    }

    timeline.push(
      ...buildConsentAndEligibility(),
      ...buildHeadphoneCheckAndCalibration(),
      ...buildIntroductionAndPractice()
    );

    if (experimentConfig.condition === "condition_1") {
      timeline.push(...buildCondition1Trials());
    } else if (experimentConfig.condition === "condition_2") {
      timeline.push(...buildCondition2Trials());
    }

    timeline.push(
      ...buildParticipantQuestionnaires(),
      ...buildDebrief()
    );

    /* ------------------------------------------------------------------
       5. RUN THE EXPERIMENT

       Leave this disabled until at least one trial has been added.
       ------------------------------------------------------------------ */

    jsPsych.run(timeline);
  }

  startExperiment();
