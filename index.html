  <!-- Keep startup feedback independent of every external script and module. -->
  <script id="survey-startup-guard">
    const surveyStartup = (() => {
      const language = "kor"; // "eng" or "kor"; shared by the entire survey.
      document.documentElement.lang = language === "eng" ? "en" : "ko";
      const text = language === "eng" ? {
        loading: "The experiment is being loaded",
        failure: "The experiment could not start. Please reload the page or contact ben701@kaist.ac.kr.",
        reference: "Session ID: "
      } : {
        loading: "실험이 로딩중입니다",
        failure: "실험을 시작하지 못했습니다. 페이지를 새로고침하거나 ben701@kaist.ac.kr로 문의해 주세요.",
        reference: "세션 ID: "
      };
      let started = false;
      let failed = false;
      let reference = "";
      let resolveStyles;
      let rejectStyles;
      const stylesReady = new Promise((resolve, reject) => {
        resolveStyles = resolve;
        rejectStyles = reject;
      });
      // Report early failures; the promise awaited by startup stays rejected.
      stylesReady.catch(() => fail());

      function render() {
        const status = document.getElementById("survey-startup-status");
        const message = failed
          ? text.failure + (reference ? " " + text.reference + reference : "")
          : text.loading;
        if (status) status.textContent = message;
        else if (failed && document.body) document.body.textContent = message;
      }
      function fail(sessionId) {
        if (started || location.protocol === "file:") return;
        failed = true;
        if (typeof sessionId === "string") reference = sessionId;
        render();
        rejectStyles(new Error("SURVEY_STARTUP_FAILED"));
      }
      function onError() { fail(); }
      window.addEventListener("error", onError, true);
      window.addEventListener("unhandledrejection", onError);
      document.addEventListener("DOMContentLoaded", render, { once: true });
      return {
        language, stylesReady, render, fail,
        get failed() { return failed; },
        stylesLoaded() { resolveStyles(); },
        complete() {
          if (failed) throw new Error("SURVEY_STARTUP_FAILED");
          if (started) return;
          started = true;
          window.removeEventListener("error", onError, true);
          window.removeEventListener("unhandledrejection", onError);
          document.getElementById("survey-startup")?.remove();
        }
      };
    })();
  </script>

<script type="module">
  "use strict";

  import { loadBigFive, buildBigFiveTrials } from "./questionnaires/bigfive/questionnaire.js";
  import { createBigFiveCsv } from "./questionnaires/bigfive/export.js";
  import { loadGmsi, buildGmsiTrials } from "./questionnaires/gmsi/questionnaire.js";
  import { createGmsiCsv } from "./questionnaires/gmsi/export.js";
  import { createExperimentCsv, createProceduralCsv } from "./exports/study.js";
  import { createResultsZip } from "./exports/zip.js";

  if (surveyStartup.failed) throw new Error("SURVEY_STARTUP_FAILED");

  /* ------------------------------------------------------------------
     1. INITIALIZE JSPSYCH
     ------------------------------------------------------------------ */

  const jsPsych = initJsPsych({
    // Use WebAudio for more precise audio presentation.
    use_webaudio: true,

    // Display overall experiment progress.
    show_progress_bar: true,
    auto_update_progress_bar: true,
    message_progress_bar: "진행률",

    on_trial_start: function () { surveyStartup.complete(); },

    // Do not add an automatic delay between trials.
    // Timing gaps should be defined explicitly within the timeline.
    default_iti: 0,

    // Treat uppercase and lowercase keyboard responses identically.
    case_sensitive_responses: false,

    // Runs when the complete experiment ends.
    on_finish: function () {
      // Keep submission pending until DataPipe confirms the OSF upload.
      return finishSurveyAndSave();
    }
  });

  const timeline = [];

  /* ------------------------------------------------------------------
     2. EXPERIMENT CONFIGURATION
     ------------------------------------------------------------------ */

  // Language for Condition 2, the second-session choice, GMSI, Big Five, and saving.
  const lang = surveyStartup.language;

  const maxPracticeAttempts = 3;
  const experimentConfig = {
    // Assigned from DataPipe before instructions, practice, or main trials.
    condition: null,

    // TEMPORARY: keep consent/demographics, then go directly to questionnaires.
    // Set false to run calibration, practice, and the normal listening sessions.
    skipSessionsForVerification: false,

    // Sample numbers 1–200; each maps to its number multiplied by 20.
    // The 200 eligible files are 0020, 0040, ..., 4000.mp3.
    stimulusPoolSize: 200,
    stimulusFirstNumber: 20,
    stimulusNumberStep: 20,

    // Filled once at startup with disjoint batches of 3, 30, and 30.
    practiceAudioFiles: [],
    audioFiles: [],
    secondSessionAudioFiles: [],
    calibrationAudioFile: "audio/calibration.mp3"
  };

  // Generate one identifier for this survey run.
  const sessionId = jsPsych.randomization.randomID(16);
  let completedSessions = 0;
  let continueToSecondSession = false;
  const stimulusWorkIds = new Map();
  let bigFiveDataset;
  let gmsiDataset;

  // Change this when you revise the experiment.
  const experimentVersion = "ccm_draft_06";

  // Attach these fields to every trial row.
  jsPsych.data.addProperties({
    session_id: sessionId,
    sessions_completed: completedSessions,
    experiment_version: experimentVersion,
    session_started_at: new Date().toISOString()
  });

  const dataSavingConfig = {
    // This public experiment ID is not an OSF credential.
    endpoint: "https://pipe.jspsych.org/api/data/",
    experimentID: "RWxInotIIqbc",

    // Maximum time to wait for each upload attempt.
    timeoutMs: 30000,
    retryDelayMs: 5000
  };

  // Retrieved once before assigning the condition and assembling the timeline.
  let retrievedConditionNumber;

  function parseStimulusMetadata(csv) {
    // Read CSV quoting, including commas, escaped quotes, and line breaks.
    const rows = [];
    let row = [], field = "", quoted = false, closedQuote = false;
    const input = csv.replace(/^\uFEFF/, "");

    for (let index = 0; index < input.length; index++) {
      const character = input[index];
      if (quoted) {
        if (character === '"') {
          if (input[index + 1] === '"') {
            field += '"';
            index++;
          } else {
            quoted = false;
            closedQuote = true;
          }
        } else {
          field += character;
        }
      } else if (character === '"') {
        if (field !== "" || closedQuote) throw new Error("STIMULUS_METADATA_CSV_INVALID");
        quoted = true;
      } else if ([",", "\n", "\r"].includes(character)) {
        row.push(field);
        field = "";
        closedQuote = false;
        if (character !== ",") {
          rows.push(row);
          row = [];
          if (character === "\r" && input[index + 1] === "\n") index++;
        }
      } else {
        if (closedQuote) throw new Error("STIMULUS_METADATA_CSV_INVALID");
        field += character;
      }
    }

    if (quoted) throw new Error("STIMULUS_METADATA_CSV_INVALID");
    if (row.length || field !== "" || closedQuote) {
      row.push(field);
      rows.push(row);
    }

    const header = rows.shift();
    if (!header || new Set(header).size !== header.length ||
        !header.includes("clip_filename") || !header.includes("work_id")) {
      throw new Error("STIMULUS_METADATA_HEADER_INVALID");
    }

    const clipColumn = header.indexOf("clip_filename");
    const workColumn = header.indexOf("work_id");
    const workIds = new Map();
    for (const values of rows) {
      if (values.length === 1 && values[0] === "") continue;
      const filename = values[clipColumn];
      const workId = values[workColumn];
      if (values.length !== header.length || !/^\d{4,}\.mp3$/.test(filename) ||
          typeof workId !== "string" || !workId.trim() || workIds.has(filename)) {
        throw new Error("STIMULUS_METADATA_ROW_INVALID");
      }
      workIds.set(filename, workId);
    }
    return workIds;
  }

  async function selectSessionStimuli() {
    const pool = Array.from({ length: experimentConfig.stimulusPoolSize }, (_, index) => index + 1);
    const audioFileForNumber = number =>
      `audio/${String(experimentConfig.stimulusFirstNumber + (number - 1) * experimentConfig.stimulusNumberStep).padStart(4, "0")}.mp3`;
    const audioPool = pool.map(audioFileForNumber);
    if (audioPool.includes(experimentConfig.calibrationAudioFile)) {
      throw new Error("STIMULUS_POOL_INCLUDES_SETUP_AUDIO");
    }

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 30000);
    try {
      const response = await fetch("metadata.csv", { signal: controller.signal, cache: "no-store" });
      if (!response.ok) throw new Error("STIMULUS_METADATA_HTTP_ERROR");
      const workIds = parseStimulusMetadata(await response.text());
      for (const audioFile of audioPool) {
        const workId = workIds.get(audioFile.split("/").pop());
        if (workId === undefined) throw new Error("STIMULUS_METADATA_MISSING_CLIP");
        stimulusWorkIds.set(audioFile, workId);
      }

      const selectedNumbers = jsPsych.randomization.sampleWithoutReplacement(pool, maxPracticeAttempts + 60);
      if (selectedNumbers.length !== maxPracticeAttempts + 60 ||
          new Set(selectedNumbers).size !== selectedNumbers.length ||
          selectedNumbers.some(number => !pool.includes(number))) {
        throw new Error("STIMULUS_SELECTION_INVALID");
      }
      const selected = selectedNumbers.map(audioFileForNumber);
      experimentConfig.practiceAudioFiles = selected.slice(0, maxPracticeAttempts);
      experimentConfig.audioFiles = selected.slice(maxPracticeAttempts, maxPracticeAttempts + 30);
      experimentConfig.secondSessionAudioFiles = selected.slice(maxPracticeAttempts + 30);
      jsPsych.data.addProperties({
        stimulus_pool_size: experimentConfig.stimulusPoolSize,
        stimulus_first_number: experimentConfig.stimulusFirstNumber
      });
    } finally {
      clearTimeout(timeout);
    }
  }

  function getStimulusWorkId(audioFile) {
    if (!stimulusWorkIds.has(audioFile)) throw new Error("STIMULUS_WORK_ID_MISSING");
    return stimulusWorkIds.get(audioFile);
  }

  async function retrieveConditionNumber() {
    if (
      typeof dataSavingConfig.experimentID !== "string" ||
      !/^[A-Za-z0-9]+$/.test(dataSavingConfig.experimentID)
    ) {
      throw new Error("CONDITION_EXPERIMENT_ID_INVALID");
    }

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 30000);

    try {
      // DataPipe must have sequential assignment enabled with two conditions.
      // Request once: another request would consume the next assignment.
      const response = await fetch("https://pipe.jspsych.org/api/condition/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ experimentID: dataSavingConfig.experimentID }),
        signal: controller.signal
      });

      if (response.status !== 200) {
        throw new Error("CONDITION_HTTP_ERROR");
      }

      const result = await response.json();
      if (result?.error != null || ![0, 1].includes(result?.condition)) {
        throw new Error("CONDITION_RESPONSE_INVALID");
      }

      return result.condition;
    } finally {
      clearTimeout(timeout);
    }
  }

  // One completion operation per page session, including failed attempts.
  let submissionPromise = null;

  function submissionError(code, state = "rejected", httpStatus = null) {
    return Object.assign(new Error(code), {
      submissionCode: code,
      submissionState: state,
      httpStatus
    });
  }

  // Internal diagnostic codes never appear on the participant's screen.
  // Unrecognized server errors get SAVE_REMOTE_UNKNOWN, not raw response text.
  const dataPipeErrorCodes = new Set([
    "MISSING_PARAMETER", "EXPERIMENT_NOT_FOUND", "EXPERIMENT_DATA_NOT_FOUND",
    "DATA_COLLECTION_NOT_ACTIVE", "BASE64DATA_COLLECTION_NOT_ACTIVE",
    "CONDITION_ASSIGNMENT_NOT_ACTIVE", "SESSION_LIMIT_REACHED",
    "INVALID_DATA", "INVALID_BASE64_DATA", "USER_DATA_NOT_FOUND", "INVALID_OWNER",
    "INVALID_OSF_TOKEN", "INVALID_REFRESH_TOKEN", "NOT_USING_OAUTH",
    "OAUTH_NOT_SETUP", "TOKEN_RESOLUTION_ERROR", "FILE_EXISTS",
    "UPLOAD_ERROR", "UPLOAD_EXCEPTION", "PROVIDER_NOT_CONNECTED",
    "PROVIDER_TOKEN_EXPIRED", "EXPERIMENT_FINALIZED", "INVALID_METADATA_ERROR",
    "OSF_METADATA_UPLOAD_ERROR", "METADATA_ERROR", "DATA_PERSIST_ERROR",
    "UNKNOWN_ERROR_GETTING_CONDITION"
  ]);

  function validateDataSavingConfig() {
    if (dataSavingConfig.endpoint !== "https://pipe.jspsych.org/api/data/") {
      throw submissionError("SAVE_CONFIG_ENDPOINT");
    }
    if (
      typeof dataSavingConfig.experimentID !== "string" ||
      !/^[A-Za-z0-9]+$/.test(dataSavingConfig.experimentID)
    ) {
      throw submissionError("SAVE_CONFIG_EXPERIMENT_ID");
    }
    if (!Number.isInteger(dataSavingConfig.timeoutMs) || dataSavingConfig.timeoutMs <= 0) {
      throw submissionError("SAVE_CONFIG_TIMEOUT");
    }
    if (!Number.isInteger(dataSavingConfig.retryDelayMs) || dataSavingConfig.retryDelayMs < 5000) {
      throw submissionError("SAVE_CONFIG_RETRY_DELAY");
    }
    if (typeof fetch !== "function") {
      throw submissionError("SAVE_BROWSER_FETCH");
    }
    if (typeof AbortController !== "function") {
      throw submissionError("SAVE_BROWSER_ABORT");
    }
    if (typeof TextEncoder !== "function") {
      throw submissionError("SAVE_BROWSER_ENCODING");
    }
  }

  // Validate local settings before any trials. Remote setup requires a pilot.
  try {
    validateDataSavingConfig();
  } catch (error) {
    surveyStartup.fail(sessionId);
    throw error;
  }

  /* ------------------------------------------------------------------
     3. WORKFLOW SECTIONS

     Each function returns an array of jsPsych trials. Add the relevant
     trial objects after the participant-facing text has been finalized.

  function buildIntroductionAndPractice() {
    // 1. VALIDATE THE ASSIGNED CONDITION AND RESERVED PRACTICE FILES
    // The condition must already be assigned before timeline assembly.
    const condition = experimentConfig.condition;
    const practiceFiles = experimentConfig.practiceAudioFiles;

    if (!["condition_1", "condition_2"].includes(condition)) {
      throw new Error(
        "Assign condition_1 or condition_2 before building practice."
      );
    }

    if (!Array.isArray(practiceFiles) || practiceFiles.length !== maxPracticeAttempts ||
        new Set(practiceFiles).size !== maxPracticeAttempts ||
        practiceFiles.some(audioFile => !stimulusWorkIds.has(audioFile) ||
          experimentConfig.audioFiles.includes(audioFile) ||
          experimentConfig.secondSessionAudioFiles.includes(audioFile))) {
      throw new Error("PRACTICE_STIMULI_INVALID");
    }

    // 2. SHOW INSTRUCTIONS ONLY FOR THE ASSIGNED RESPONSE FORMAT
    // All Korean text below is editable draft wording.
    // No emotion examples are supplied to the free-response group.
    const conditionPages = {
      condition_1: [
        `
            <h2>감정 단어 입력</h2>
            <p>음악을 듣는 동안 실제로 느낀 감정을 한 단어씩 입력해 주세요.</p>

          `
      ],

      condition_2: [
        `
            <h2>느낌 평가</h2>
            <p>음악을 듣는 동안 느낀 감정을 각 문장에 대해 평가해 주세요</p>
            <p>화면에 표시된 기준을 보고 1부터 9까지 중 하나를 선택해 주세요.</p>
          `,
        `
            <h2>응답 방법</h2>
            <p>각 문장마다 하나의 응답을 선택해 주세요.</p>
            <p>제출 전에는 선택을 바꿀 수 있습니다.</p>
            <p>화면 아래에도 문항이 있으면 내려서 확인해 주세요.</p>
            <p>모든 문항에 답한 뒤 응답 완료를 눌러 주세요.</p>
            <p>응답이 완료되면 친숙도를 확인한 뒤 다음 음악을 재생합니다</p>
          `
      ]
    };

    const instructions = {
      type: jsPsychInstructions,

      pages: [
        `
            <h2>실험 안내</h2>
            <p>본 실험은 5초 길이의 음악을 듣고 느껴지는 감정을 답하는 실험입니다.</p>
            <p>음악 재생이 끝나면 응답 화면이 나타납니다.</p>
            <p>정답은 없으니 자신의 느낌대로 답해 주세요.</p>
          `,

        // Insert only the assigned condition's instruction pages.
        ...conditionPages[condition],

        `
            <h2>${condition === "condition_2" ? "연습시행" : "연습 시행"}</h2>
            <p>먼저 음악 한 곡으로 이 과정을 연습합니다.</p>
            <p>연습은 최대 3회까지 할 수 있으며, 원하실 경우 3회를 전부 마치지 않았더라도 본 실험으로 진행할 수 있습니다.</p>
            <p>3회 연습을 마치면 본 실험으로 진행합니다.</p>
          `
      ],

      show_clickable_nav: true,
      allow_backward: true,
      allow_keys: false,

      button_label_previous: "이전",
      button_label_next: "다음",

      post_trial_gap: 0,

      data: {
        task: "instructions",
        phase: "practice",
        condition: condition
      }
    };

    // 3. REUSE THE ASSIGNED CONDITION'S ACTUAL TRIAL BUILDER
    // A separate builder call creates fresh trial objects and response state.
    const buildAssignedTrials = condition === "condition_1"
      ? buildCondition1Trials
      : buildCondition2Trials;

    const practiceSets = practiceFiles.map(practiceFile => {
      const [preload, ...trials] = buildAssignedTrials({
        audioFiles: [practiceFile],
        phase: "practice"
      });
      if (preload?.type !== jsPsychPreload || preload.audio?.length !== 1 ||
          preload.audio[0] !== practiceFile || preload.data?.phase !== "practice" || !trials.length) {
        throw new Error("PRACTICE_TRIALS_INVALID");
      }
      return { preload, trials };
    });
    const preloadPractice = { ...practiceSets[0].preload, audio: [...practiceFiles] };

    // 4. LABEL EACH ATTEMPT WHILE PRESERVING RESPONSE-SAVING CALLBACKS
    function addAttemptNumber(node, attemptNumber) {
      // Condition 1 has a nested timeline.
      // Condition 2 currently returns individual trials.
      if (Array.isArray(node.timeline)) {
        return {
          ...node,
          timeline: node.timeline.map(child => addAttemptNumber(child, attemptNumber))
        };
      }

      const originalOnFinish = node.on_finish;

      return {
        ...node,

        on_finish: function (data) {
          // Preserve keyword saving, rating conversion, and other existing work.
          if (typeof originalOnFinish === "function") {
            originalOnFinish.call(this, data);
          }

          data.practice_attempt = attemptNumber;
        }
      };
    }

    // 5. RUN ONE REQUIRED ATTEMPT AND AT MOST TWO OPTIONAL ATTEMPTS
    let continuePractice = true;
    const attempts = practiceSets.map(({ trials }, index) => {
      const attemptNumber = index + 1;
      const lastAttempt = attemptNumber === maxPracticeAttempts;
      const startAttempt = {
        type: jsPsychHtmlButtonResponse,
        stimulus: `
          <h2>연습 ${attemptNumber}/${maxPracticeAttempts}</h2>
          <p>준비가 되면 연습 시작을 눌러 주세요.</p>
        `,
        choices: ["연습 시작"],
        post_trial_gap: 0,
        data: { task: "practice_start", phase: "practice", condition },
        on_finish: function (data) { data.practice_attempt = attemptNumber; }
      };
      const repeatDecision = {
        type: jsPsychHtmlButtonResponse,
        stimulus: `
          <h2>연습 ${attemptNumber}회를 마쳤습니다.</h2>
          ${lastAttempt
            ? "<p>3회의 연습을 모두 마쳤습니다. 본 실험 시작을 눌러 진행해 주세요.</p>"
            : `<p>다른 음악으로 다시 연습하거나 본 실험을 시작할 수 있습니다.</p><p>${maxPracticeAttempts - attemptNumber}회의 추가 연습이 가능합니다.</p>`}
        `,
        choices: ["다시 연습하기", "본 실험 시작"],
        button_html: function (choice, choiceIndex) {
          return `<button class="jspsych-btn"${lastAttempt && choiceIndex === 0 ? " disabled" : ""}>${choice}</button>`;
        },
        post_trial_gap: 0,
        data: { task: "practice_decision", phase: "practice", condition },
        on_finish: function (data) {
          if (![0, 1].includes(data.response) || (lastAttempt && data.response === 0)) {
            throw new Error("PRACTICE_DECISION_INVALID");
          }
          data.practice_attempt = attemptNumber;
          data.repeat_practice = !lastAttempt && data.response === 0;
          continuePractice = data.repeat_practice;
        }
      };
      return {
        timeline: [startAttempt, ...trials.map(node => addAttemptNumber(node, attemptNumber)), repeatDecision],
        conditional_function: function () { return continuePractice; }
      };
    });

    // All three clips stay reserved, including any skipped optional attempts.
    return [instructions, preloadPractice, { timeline: attempts }];
  }

  function showTrialCounter(trialNumber, anchorSelector) {
    if (!Number.isInteger(trialNumber) || trialNumber < 1 || trialNumber > 30) {
      throw new Error("TRIAL_COUNTER_INVALID");
    }
    const anchor = jsPsych.getDisplayElement().querySelector(anchorSelector);
    if (!anchor) throw new Error("TRIAL_COUNTER_BUTTON_MISSING");
    const counter = document.createElement("div");
    counter.className = "trial-counter";
    counter.textContent = `${trialNumber}/30`;
    anchor.before(counter);
  }

  function finishExcerptResponseTiming(data, excerptEndedAtMs) {
    const completedAtMs = performance.now();
    if (!Number.isFinite(excerptEndedAtMs) || !Number.isFinite(completedAtMs) || completedAtMs < excerptEndedAtMs) {
      throw new Error("EXCERPT_RESPONSE_TIMING_INVALID");
    }
    data.familiarity_completed_at_ms = completedAtMs;
    data.response_time_seconds = (completedAtMs - excerptEndedAtMs) / 1000;
  }

  function buildCondition1Trials({
    audioFiles = experimentConfig.audioFiles,
    phase = "main"
  } = {}) {
    /* ---------------------------------------------------------------
      1. CONFIGURATION VALIDATION
      --------------------------------------------------------------- */

    if (experimentConfig.condition !== "condition_1") {
      throw new Error(
        'buildCondition1Trials() can only be used with "condition_1".'
      );
    }

    if (
      !Array.isArray(audioFiles) ||
      audioFiles.length === 0
    ) {
      throw new Error(
        "audioFiles must contain at least one audio file."
      );
    }

    const invalidAudioFiles = audioFiles.filter(
      function (audioFile) {
        return (
          typeof audioFile !== "string" ||
          audioFile.trim() === ""
        );
      }
    );

    if (invalidAudioFiles.length > 0) {
      throw new Error(
        "Every item in experimentConfig.audioFiles must be a valid string."
      );
    }


    /* ---------------------------------------------------------------
      2. CONSTRUCT TIMELINE VARIABLES
      --------------------------------------------------------------- */

    const condition1Stimuli =
      audioFiles.map(
        function (audioFile, index) {
          const fileName = audioFile.split("/").pop();

          const stimulusId = fileName.replace(
            /\.[^/.]+$/,
            ""
          );

          return {
            audioFile: audioFile,
            stimulusId: stimulusId,
            sourceIndex: index + 1,
            ...(phase === "main" ? { workId: getStimulusWorkId(audioFile) } : {})
          };
        }
      );


    /* ---------------------------------------------------------------
      3. PRELOAD ALL CONDITION 1 AUDIO
      --------------------------------------------------------------- */

    const preloadCondition1Audio = {
      type: jsPsychPreload,

      // Use the files passed into this function.
      // This works for both main trials and practice.
      audio: [...audioFiles],

      // Allow up to 60 seconds for loading.
      // This does not change the excerpt playback duration.
      max_load_time: 60000,

      // Stop here if loading fails.
      continue_after_error: false,
      show_detailed_errors: false,

      message: `
    <p>음악 파일을 불러오고 있습니다. 잠시 기다려 주세요.</p>
  `,

      error_message: `
    <p>음악 파일을 불러오지 못했습니다.</p>
    <p>인터넷 연결을 확인한 뒤 연구자에게 문의해 주세요.</p>
  `,

      data: {
        task: "preload",
        phase: phase,
        condition: "condition_1"
      }
    };
    /* ---------------------------------------------------------------
      4. PRESENT THE FIVE-SECOND EXCERPT
      --------------------------------------------------------------- */

    let excerptEndedAtMs = null;
    let trialNumber = 0;
    const listenToExcerpt = {
      type: jsPsychAudioKeyboardResponse,

      stimulus: jsPsych.timelineVariable("audioFile"),

      choices: "NO_KEYS",

      response_allowed_while_playing: false,

      trial_ends_after_audio: true,

      on_finish: function (data) {
        excerptEndedAtMs = performance.now();

      data: {
        task: "excerpt_listening",

        stimulus_id:
          jsPsych.timelineVariable("stimulusId"),

        source_index:
          jsPsych.timelineVariable("sourceIndex"),

        audio_file:
          jsPsych.timelineVariable("audioFile")
      }
    };


    /* ---------------------------------------------------------------
      5. COLLECT EMOTION KEYWORDS
      --------------------------------------------------------------- */

    let emotionKeywords = [];
    let keywordEvents = [];
    let responseScreenStart = null;
    let removeSubmitShortcut = null;

    const collectEmotionKeywords = {
      type: jsPsychHtmlButtonResponse,

      stimulus: `
      <div class="keyword-response">
    <h2>느낀 감정</h2>

    <p>

      id="emotion-keyword-input"

    >

    <p>한 단어를 입력한 뒤 Enter를 눌러 주세요.</p>
    <p>입력한 단어를 지우려면 옆의 ×를 눌러 주세요.</p>

    <div
      id="emotion-keyword-tags"

`,

      choices: ["응답 완료"],

      data: {
        task: "free_response",
        phase: phase,
        condition: "condition_1",
        ...(phase === "main" ? { work_id: jsPsych.timelineVariable("workId") } : {}),

        stimulus_id:
          jsPsych.timelineVariable("stimulusId"),

        source_index:
          jsPsych.timelineVariable("sourceIndex"),

        audio_file:
          jsPsych.timelineVariable("audioFile")
      },

      on_start: function () {
        // Reset the response variables before every excerpt.
        emotionKeywords = [];
        keywordEvents = [];
        responseScreenStart = null;
      },

      on_load: function () {
        responseScreenStart = performance.now();

        const display = jsPsych.getDisplayElement();

        const input = display.querySelector(
          "#emotion-keyword-input"
        );

        const tagsContainer = display.querySelector(
          "#emotion-keyword-tags"
        );

        const countDisplay = display.querySelector(
          "#emotion-keyword-count"
        );

        const messageDisplay = display.querySelector(
          "#emotion-keyword-message"
        );

        const continueButton = display.querySelector(
          ".jspsych-btn"
        );

        continueButton.textContent =
          `응답 완료 (${/Mac/i.test(navigator.platform) ? "cmd" : "ctrl"} + Enter)`;

        if (phase === "main") {
          showTrialCounter(trialNumber, "#jspsych-html-button-response-btngroup");
        }

        function submitWithShortcut(event) {
          if (
            event.key !== "Enter" ||
            !(event.ctrlKey || event.metaKey) ||
            event.altKey || event.shiftKey ||
            event.isComposing || event.keyCode === 229
          ) {
            return;
          }

          event.preventDefault();
          event.stopPropagation();

          if (!event.repeat && !continueButton.disabled) {
            continueButton.click();
          }
        }

        // Capture the shortcut before the input's Enter-to-add handler.
        display.addEventListener("keydown", submitWithShortcut, true);
        removeSubmitShortcut = function () {
          display.removeEventListener("keydown", submitWithShortcut, true);
        };


        function normalizeKeyword(value) {
          return value
            .trim()
            .replace(/\s+/g, " ");
        }


        function keywordsAreEqual(first, second) {
          return first.localeCompare(
            second,
            "ko",
            {
              sensitivity: "base"
            }
          ) === 0;
        }


        function updateContinueButton() {
          const hasSubmittedKeyword =
            emotionKeywords.length > 0;

          const hasUnsubmittedText =
            normalizeKeyword(input.value) !== "";

          continueButton.disabled =
            !hasSubmittedKeyword ||
            hasUnsubmittedText;
        }


        function renderKeywords() {
          tagsContainer.replaceChildren();

          emotionKeywords.forEach(
            function (keyword, index) {
              const tag = document.createElement("span");
              tag.className = "keyword-tag";
              tag.setAttribute("role", "listitem");

              const keywordText =
                document.createElement("span");

              keywordText.textContent = keyword;

              const removeButton =
                document.createElement("button");

              removeButton.type = "button";
              removeButton.className = "keyword-remove";
              removeButton.textContent = "×";

              removeButton.setAttribute(
                "aria-label",
                `${keyword} 삭제`
              );

              removeButton.addEventListener(
                "click",
                function () {
                  const removedKeyword =
                    emotionKeywords[index];

                  emotionKeywords.splice(index, 1);

                  keywordEvents.push({
                    action: "remove",
                    keyword: removedKeyword,
                    rt: Math.round(
                      performance.now() -
                      responseScreenStart
                    )
                  });

                  messageDisplay.textContent = "";

                  renderKeywords();
                  input.focus();
                }
              );

              tag.append(
                keywordText,
                removeButton
              );

              tagsContainer.appendChild(tag);
            }
          );

          countDisplay.textContent =
            `입력한 감정 수 ${emotionKeywords.length}`;

          updateContinueButton();
        }


        function addKeyword() {
          const keyword =
            normalizeKeyword(input.value);

          if (keyword === "") {
            return;
          }

          const duplicateExists =
            emotionKeywords.some(
              function (existingKeyword) {
                return keywordsAreEqual(
                  existingKeyword,
                  keyword
                );
              }
            );

          if (duplicateExists) {
            messageDisplay.textContent =
              "이미 입력한 감정입니다";

            input.select();
            return;
          }

          emotionKeywords.push(keyword);

          keywordEvents.push({
            action: "add",
            keyword: keyword,
            rt: Math.round(
              performance.now() -
              responseScreenStart
            )
          });

          input.value = "";
          messageDisplay.textContent = "";

          renderKeywords();
          input.focus();
        }


        input.addEventListener(
          "keydown",
          function (event) {
            /*
            * Do not treat Enter as submission while the Korean
            * input method editor is still composing a syllable.
            */
            if (
              event.key !== "Enter" ||
              event.isComposing ||
              event.keyCode === 229
            ) {
              return;
            }

            event.preventDefault();
            addKeyword();
          }
        );


        input.addEventListener(
          "input",
          function () {
            messageDisplay.textContent = "";
            updateContinueButton();
          }
        );

        renderKeywords();
        input.focus();
      },

      on_finish: function (data) {
        removeSubmitShortcut();
        removeSubmitShortcut = null;

        data.emotion_keywords =
          emotionKeywords.slice();

        data.keyword_count =
          emotionKeywords.length;

        data.keyword_events =
          keywordEvents.slice();
      }
    };


    /* ---------------------------------------------------------------
      6. COLLECT FAMILIARITY
      --------------------------------------------------------------- */

    const collectFamiliarity = {
      type: jsPsychSurveyLikert,
      css_classes: ["familiarity-rating"],

      preamble: `
          <div class="survey-section">
            <h2>음악의 친숙도</h2>
          </div>
        `,

      questions: [
        {
          prompt: "방금 들은 음악이 얼마나 친숙했나요?",

          name: "familiarity",

          labels: [
            "전혀 친숙하지 않음",
            "",
            "",
            "",
            "",
            "",
            "",
            "",
            "매우 친숙함"
          ],

          required: true
        }
      ],

      randomize_question_order: false,

      button_label: "다음",

      data: {
        task: "familiarity",
        phase: phase,
        condition: "condition_1",
        ...(phase === "main" ? { work_id: jsPsych.timelineVariable("workId") } : {}),

        stimulus_id:
          jsPsych.timelineVariable("stimulusId"),

        source_index:
          jsPsych.timelineVariable("sourceIndex"),

        audio_file:
          jsPsych.timelineVariable("audioFile")
      },

      on_load: function () {
        if (phase === "main") {
          showTrialCounter(trialNumber, "#jspsych-survey-likert-next");
        }
      },

      on_finish: function (data) {
        finishExcerptResponseTiming(data, excerptEndedAtMs);
        excerptEndedAtMs = null;
        const raw = data.response?.familiarity;

        // Preserve the original response and save a separate 1–9 score.
        // Missing or invalid responses remain null.
        data.familiarity_rating_1_to_9 =
          Number.isInteger(raw) && raw >= 0 && raw <= 8
            ? raw + 1
            : null;
      }
    };


    /* ---------------------------------------------------------------
      7. COMBINE THE THREE STEPS
      --------------------------------------------------------------- */

    const condition1Procedure = {
      timeline: [
        listenToExcerpt,
        collectEmotionKeywords,
        collectFamiliarity
      ],

      // Repeat the configured clips to make 30 complete main trials.
      timeline_variables: phase === "main"
        ? Array.from({ length: 30 }, (_, index) =>
          condition1Stimuli[index % condition1Stimuli.length])
        : condition1Stimuli,

      randomize_order: true,

      repetitions: 1
    };


    /* ---------------------------------------------------------------
      8. RETURN THE COMPLETE CONDITION
      --------------------------------------------------------------- */

    return [
      preloadCondition1Audio,
      condition1Procedure
    ];
  }

  function buildCondition2Trials({
    audioFiles = experimentConfig.audioFiles,
    phase = "main"
  } = {}) {
    let excerptEndedAtMs = null;
    if (lang !== "eng" && lang !== "kor") {
      throw new Error('Set lang to "eng" or "kor" for Condition 2 ratings.');
    }

    const scaleText = {
      eng: {
        questionStart: "To what extent does this make you feel...",
        neutral: "neutral"
      },
      kor: {
        questionStart: "이 음악을 들으면...",

      }
    }[lang];

    // Copied from translation.txt: q_eng/q_kor, 1_eng/1_kor, 9_eng/9_kor.
    // Keep this dictionary in sync when the translation file is revised.
    const dimensionText = {
      pleasantness: {
        eng: {
          prompt: "...Pleasant?",
          anchor1: "very unpleasant",
          anchor9: "very pleasant"
        },
        kor: {
          prompt: "얼마나 유쾌한 느낌이 듭니까?",
          anchor1: "매우 불쾌하다",
          anchor9: "매우 유쾌하다"
        }
      },

        eng: {
          prompt: "...Stimulated?",

        },
        kor: {
          prompt: "얼마나 각성되는 느낌이 듭니까?",
          anchor1: "전혀 각성되는 느낌이 들지 않는다",

        }
      },
      dominance: {
        eng: {
          prompt: "...Dominant?",
          anchor1: "more submissive",

        },
        kor: {
          prompt: "얼마나 통제하고 있다는 느낌이 듭니까?",
          anchor1: "전혀 통제하고 있다는<br>느낌이 들지 않는다",
          anchor9: "매우 통제하는 느낌이 든다"
        }
      },
      focus: {
        eng: {
          prompt: "...Focused?",
          anchor1: "more unfocused",
          anchor9: "more focused"
        },
        kor: {
          prompt: "얼마나 집중되는 느낌이 듭니까?",
          anchor1: "전혀 집중되지 않는다",
          anchor9: "매우 집중된다"
        }
      },
      certainty: {
        eng: {
          prompt: "...Certain?",
          anchor1: "very uncertain",
          anchor9: "very certain"
        },
        kor: {
          prompt: "얼마나 확신이 듭니까?",
          anchor1: "매우 불확실한 느낌이 든다",
          anchor9: "매우 확실한 느낌이 든다"
        }
      },
      obstruction: {
        eng: {
          prompt: "...Like you're obstructed by something?",
          anchor1: "very unobstructed",
          anchor9: "very obstructed"
        },
        kor: {
          prompt: "무언가에 가로막힌 느낌이 얼마나 듭니까?",
          anchor1: "전혀 가로막히지<br>않은 느낌이 든다",
          anchor9: "매우 가로막힌 느낌이 든다"
        }
      },
      safety: {
        eng: {
          prompt: "...Safe?",
          anchor1: "very unsafe",
          anchor9: "very safe"
        },
        kor: {
          prompt: "얼마나 안전하다고 느낍니까?",
          anchor1: "매우 안전하지 않은 느낌이 든다",
          anchor9: "매우 안전한 느낌이 든다"
        }
      },
      group_identity: {
        eng: {
          prompt: "...Identity within a group?",
          anchor1: "lack of group identity",
          anchor9: "strong group identity"
        },
        kor: {
          prompt: "어떤 집단과 일체감을 얼마나 느낍니까?",
          anchor1: "집단과의 일체감이 <br>전혀 느껴지지 않는다",
          anchor9: "집단과의 일체감이 <br>매우 강하게 느껴진다"
        }
      },
      person_commitment: {
        eng: {
          prompt: "...Commitment to a person?",
          anchor1: "lack of commitment to a person",
          anchor9: "strong commitment to a person"
        },
        kor: {
          prompt: "특정 사람에게 헌신하는 느낌이 얼마나 듭니까?",
          anchor1: "특정 사람에게 헌신하는<br>느낌이 전혀 들지 않는다",
          anchor9: "특정 사람에게 매우 헌신하는 느낌이 든다"
        }
      }
    };

    // 1. EDITABLE RATING SCHEME
    // Increment this version whenever prompts, anchors, or dimensions change.
    const settings = {
      version: "dimensions_draft_03",
      randomizeExcerptOrder: true,

      // Edit this array to add, remove, or reorder dimensions.
      // Keep IDs stable for wording edits; use a new ID for a new construct.
      dimensions: [
        "pleasantness",
        "stimulation",
        "dominance",
        "focus",
        // Felt certainty, not confidence in the survey answer.
        "certainty",
        "obstruction",
        "safety",
        "group_identity",
        "person_commitment"
      ].map(id => {
        const text = dimensionText[id]?.[lang];
        if (
          !text ||
          ["prompt", "anchor1", "anchor9"].some(
            key => typeof text[key] !== "string" || !text[key].trim()
          )
        ) {
          throw new Error("Missing dimensional text for " + id + " in " + lang);
        }

        return {
          id: id,
          prompt: text.prompt,
          labels: [
            "1<br>" + text.anchor1, "2", "3", "4", "5<br>" + scaleText.neutral,
            "6", "7", "8", "9<br>" + text.anchor9
          ]
        };
      }),

      // Familiarity remains a separate screen and data row.
      familiarity: {
        id: "familiarity",
        prompt: "방금 들은 음악이 얼마나 친숙했나요?",
        labels: [
          "1<br>전혀 친숙하지 않음", "2", "3", "4",
          "5", "6", "7", "8", "9<br>매우 친숙함"
        ]
      },

      text: {
        loading: "<p>음악 파일을 불러오고 있습니다.</p>",
        loadError: "<p>음악 파일을 불러오지 못했습니다.</p>",
        listening: "<p>음악을 주의 깊게 들어 주세요.</p>",

        ratingPreamble: "<h2>" + scaleText.questionStart + "</h2>",

        familiarityPreamble: "<h2>음악의 친숙도</h2>",
        submitRatings: "응답 완료",
        submitFamiliarity: "다음"
      }
    };

    // 2. READ AND VALIDATE THE EXISTING CONFIGURATION
    const randomizeOrder = settings.randomizeExcerptOrder;

    // Catch configuration mistakes before constructing any trials.
    if (experimentConfig.condition !== "condition_2") {
      throw new Error('Condition 2 requires condition: "condition_2".');
    }

    if (
      !Array.isArray(audioFiles) ||
      audioFiles.length === 0 ||
      audioFiles.some(file => typeof file !== "string" || !file.trim())
    ) {
      throw new Error("audioFiles must contain non-empty audio paths.");
    }

    if (
      !Array.isArray(settings.dimensions) ||
      !settings.dimensions.length
    ) {
      throw new Error("Specify at least one dimension.");
    }

    // Copy item definitions so the constructed trials keep their own labels.
    function prepareItems(items) {
      const ids = new Set();

      return items.map(item => {
        if (
          !item ||
          typeof item.id !== "string" ||
          !/^[a-z][a-z0-9_]*$/.test(item.id) ||
          ids.has(item.id)
        ) {
          throw new Error(
            "Each item needs a unique lowercase ID: " + item?.id
          );
        }

        const labels = item.labels;

        if (
          typeof item.prompt !== "string" ||
          !item.prompt.trim() ||
          !Array.isArray(labels) ||
          labels.length !== 9 ||
          labels.some(label => typeof label !== "string")
        ) {
          throw new Error(
            "Each item needs a prompt and nine labels: " + item.id
          );
        }

        ids.add(item.id);

        return {
          id: item.id,
          prompt: item.prompt,
          labels: [...labels]
        };
      });
    }

    const dimensions = prepareItems(settings.dimensions);
    const familiarity = prepareItems([settings.familiarity]);

    // 3. REUSABLE RATING-PAGE BUILDER
    // Used for both the dimension page and the separate familiarity page.
    function makeRatingPage(items, preamble, buttonLabel, task, metadata) {
      return {
        type: jsPsychSurveyLikert,
        css_classes: task === "familiarity" ? ["familiarity-rating"] :
          task === "dimensional_rating" ? ["dimensional-rating"] : [],

        preamble: preamble,

        questions: items.map(item => ({
          name: item.id,
          prompt: item.prompt,
          // Wrap only the displayed messages; preserve the saved label strings.
          labels: task === "dimensional_rating"
            ? item.labels.map(label => label.replace(
              /<br>(.*)$/,
              '<br><span class="dimensional-anchor">$1</span>'
            ))
            : [...item.labels],
          required: true,
          default_response: null // No preselected answer.
        })),

        // Keep the array's order across excerpts.
        randomize_question_order: false,

        button_label: buttonLabel,
        post_trial_gap: 0,

        data: {
          ...metadata,
          task: task,

          // Save the actual prompts and anchors to document this draft's meaning.
          rating_schema: items.map(item => ({
            id: item.id,
            prompt: item.prompt,
            labels: [...item.labels]
          }))
        },

        on_load: function () {
          if (phase === "main") {
            showTrialCounter(metadata.excerpt_number, "#jspsych-survey-likert-next");
          }
        },

        on_finish: function (data) {
          if (task === "familiarity") {
            finishExcerptResponseTiming(data, excerptEndedAtMs);
            excerptEndedAtMs = null;
          }
          // jsPsych stores positions as 0–8. Retain those raw responses and
          // also save named 1–9 columns that are convenient in a CSV export.
          for (const item of items) {
            const raw = data.response?.[item.id];

            // Match Condition 1's familiarity column for comparison later.
            const column = task === "familiarity"
              ? "familiarity_rating_1_to_9"
              : "rating_" + item.id;

            data[column] =
              Number.isInteger(raw) && raw >= 0 && raw <= 8
                ? raw + 1
                : null;
          }

          // The plugin's rt is submission time for the entire page, not per item.
        }
      };
    }

    // 4. PRELOAD AND DETERMINE EXCERPT ORDER
    const preload = {
      type: jsPsychPreload,

      audio: [...audioFiles],
      continue_after_error: false,

      // Loading timeout only; not listening duration.
      max_load_time: 60000,

      message: settings.text.loading,
      error_message: settings.text.loadError,
      post_trial_gap: 0,

      data: {
        task: "preload",
        phase: phase,
        condition: "condition_2"
      }
    };

    const stimuli = audioFiles.map((audioFile, index) => ({
      audioFile: audioFile,

      // Example: "audio/0001.mp3" becomes "0001".
      stimulusId: audioFile
        .split("/")
        .pop()
        .replace(/\.[^/.]+$/, ""),

      // Original position in audioFiles.
      sourceIndex: index + 1,
      ...(phase === "main" ? { workId: getStimulusWorkId(audioFile) } : {})
    }));

    const orderedStimuli = randomizeOrder
      ? jsPsych.randomization.shuffle(stimuli)
      : stimuli;

    // 5. REPEAT: LISTEN -> DIMENSIONS -> FAMILIARITY
    // Each excerpt gets separate trial objects and matching identifiers.
    const trials = [preload];

    const trialCount = phase === "main" ? 30 : orderedStimuli.length;
    for (let index = 0; index < trialCount; index++) {
      const stimulus = orderedStimuli[index % orderedStimuli.length];
      const metadata = {
        condition: "condition_2",
        phase: phase,
        rating_scheme_version: settings.version,
        stimulus_id: stimulus.stimulusId,
        ...(phase === "main" ? { work_id: stimulus.workId } : {}),
        audio_file: stimulus.audioFile,
        source_index: stimulus.sourceIndex,

        // Actual presentation position after shuffling.
        excerpt_number: index + 1
      };

      const listening = {
        type: jsPsychAudioKeyboardResponse,

        stimulus: stimulus.audioFile,
        prompt: settings.text.listening,

        choices: "NO_KEYS",
        response_ends_trial: false,
        trial_ends_after_audio: true,
        post_trial_gap: 0,

        on_finish: function (data) {
          excerptEndedAtMs = performance.now();
          data.excerpt_ended_at_ms = excerptEndedAtMs;
        },

        data: {
          ...metadata,
          task: "excerpt_listening"
        }

        // Use prepared five-second files. This plays the entire file and then
        // advances; it neither trims a longer file nor supplies replay controls.
      };

      const ratings = makeRatingPage(
        dimensions,
        settings.text.ratingPreamble,
        settings.text.submitRatings,
        "dimensional_rating",
        metadata
      );

      const familiarityRating = makeRatingPage(
        familiarity,
        settings.text.familiarityPreamble,
        settings.text.submitFamiliarity,
        "familiarity",
        metadata
      );

      // Edit this one line if the within-excerpt sequence changes later.
      trials.push(listening, ratings, familiarityRating);
    }

    return trials;
  }

  function validateSessionConfiguration() {
    if (typeof experimentConfig.skipSessionsForVerification !== "boolean") {
      throw new Error("SESSION_VERIFICATION_TOGGLE_INVALID");
    }

    if (lang !== "eng" && lang !== "kor") {
      throw new Error("SESSION_LANGUAGE_INVALID");
    }

    if (!Number.isSafeInteger(experimentConfig.stimulusPoolSize) ||
        experimentConfig.stimulusPoolSize < maxPracticeAttempts + 60 ||
        !Number.isSafeInteger(experimentConfig.stimulusFirstNumber) ||
        experimentConfig.stimulusFirstNumber < 0 ||
        !Number.isSafeInteger(experimentConfig.stimulusNumberStep) ||
        experimentConfig.stimulusNumberStep < 1 ||
        !Number.isSafeInteger(experimentConfig.stimulusFirstNumber +
          (experimentConfig.stimulusPoolSize - 1) * experimentConfig.stimulusNumberStep)) {
      throw new Error("STIMULUS_POOL_CONFIG_INVALID");
    }
  }

  function buildMainSession(sessionNumber, audioFiles) {
    const buildTrials = experimentConfig.condition === "condition_1"
      ? buildCondition1Trials
      : buildCondition2Trials;

    return {
      timeline: buildTrials({ audioFiles, phase: "main" }),
      data: { session_number: sessionNumber },
      on_timeline_finish: function () {
        completedSessions += 1;
        jsPsych.data.addProperties({ sessions_completed: completedSessions });
      }
    };
  }

  function buildSecondSessionChoice() {
    const text = {

      data: {

      on_load: function () {
        const display = jsPsych.getDisplayElement();

          display.querySelector("#participant-phone-number"),
          display.querySelector("#participant-phone-number-2"),
          display.querySelector("#participant-phone-number-3")
        ];
        const focusOrder = [...phoneFields, display.querySelector("#participant-email-address")];

        phoneFields.forEach((field, index) => {
          field.addEventListener("input", function (event) {
            if (event.isComposing) return;

            const digits = field.value.replace(/[^0-9]/g, "").slice(0, field.maxLength);
            if (field.value !== digits) field.value = digits;

            const phoneStarted = phoneFields.some(input => input.value !== "");
            phoneFields.forEach(input => { input.required = phoneStarted; });

            if (field.value.length === field.maxLength && !event.inputType?.startsWith("delete")) {
              focusOrder[index + 1].focus();

          });

        }
        // Retain the raw segments and the existing combined export field.
        data.response.phone_number = parts.join("");
      }
    };

    return [contactInformation];
  }

  async function uploadCompletedSession(requestBody) {
    validateDataSavingConfig();

    // Aborting our wait does not cancel a file already received by DataPipe.
    const controller = new AbortController();

    const timeout = setTimeout(
      () => controller.abort(),
      dataSavingConfig.timeoutMs
    );

    try {
      let response;
      try {
        response = await fetch(dataSavingConfig.endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: requestBody,
          signal: controller.signal,
          credentials: "omit",
          redirect: "error"
        });
      } catch (error) {
        // Fetch cannot distinguish offline, DNS, CORS, or blocked redirects.
        throw submissionError(
          controller.signal.aborted ? "SAVE_REQUEST_TIMEOUT" : "SAVE_CONNECTION",
          "unconfirmed"
        );
      }

      // HTTP 202 is accepted/queued, not confirmation of storage on OSF.
      if (response.status === 202) {
        throw submissionError("SAVE_QUEUED", "queued", response.status);
      }
      // A conflict must block retries even if the response body is unreadable.
      if (response.status === 409) {
        throw submissionError("SAVE_HTTP_CONFLICT", "duplicate", response.status);
      }

      let confirmation;
      try {
        confirmation = await response.json();
      } catch (error) {
        const rejected = response.status >= 400 && response.status < 500 &&
          ![408, 429].includes(response.status);
        const code = controller.signal.aborted ? "SAVE_RESPONSE_TIMEOUT" :
          error?.name === "SyntaxError" ? "SAVE_RESPONSE_JSON" : "SAVE_RESPONSE_READ";
        throw submissionError(code, rejected ? "rejected" : "unconfirmed", response.status);
      }

      if (confirmation?.queued === true) {
        throw submissionError("SAVE_QUEUED", "queued", response.status);
      }
      if (confirmation?.error === "FILE_EXISTS") {
        throw submissionError("DP_FILE_EXISTS", "duplicate", response.status);
      }

      // DataPipe's successful OSF write returns 201 and this exact message.
      // It does not echo session_id. Never infer success from HTTP alone.
      if (
        response.status === 201 &&
        confirmation?.message === "Success" &&
        !Object.prototype.hasOwnProperty.call(confirmation, "error")
      ) {
        return;
      }

      // Explicit configuration/validation errors need researcher intervention.
      // Transient transport/service errors may be retried with the same body.
      const transientError = ["UPLOAD_ERROR", "UPLOAD_EXCEPTION"]
        .includes(confirmation?.error);
      const explicitError = typeof confirmation?.error === "string";
      const rejected = (explicitError && !transientError) ||
        (!transientError && response.status >= 400 && response.status < 500 &&
          ![408, 429].includes(response.status));
      if (explicitError) {
        const code = dataPipeErrorCodes.has(confirmation.error) ?
          `DP_${confirmation.error}` : "SAVE_REMOTE_UNKNOWN";
        throw submissionError(code, rejected ? "rejected" : "unconfirmed", response.status);
      }
      if (response.status >= 400) {
        throw submissionError("SAVE_HTTP_ERROR", rejected ? "rejected" : "unconfirmed", response.status);
      }
      throw submissionError("SAVE_CONFIRMATION", "unconfirmed", response.status);
    } finally {
      clearTimeout(timeout);
    }
  }

  function finishSurveyAndSave() {
    if (submissionPromise !== null) return submissionPromise;

    const text = lang === "eng" ? {
      sending: "Sending results. Do not close the tab",
      failure: "Submission could not be confirmed. Please record the session ID below and contact the researcher. Do not close or refresh this tab.",
      blocked: "Submission could not be confirmed. Please record the session ID below and contact the researcher. Do not submit again or close or refresh this tab.",
      retryHelp: "Check your connection. You may retry after five seconds.",
      reference: "Session ID: ",
      retry: "Retry submission",
      download: "Download results ZIP",
      recoveryHelp: "Download the ZIP and attach it to an email to ben701@kaist.ac.kr. Include the session ID above. Downloading does not confirm online submission.",
      recoveryFailure: "The results ZIP could not be prepared. Keep this tab open and contact ben701@kaist.ac.kr with the session ID above.",
      success: "Your responses have been saved. Thank you for participating."
    } : {
      sending: "결과를 전송중입니다. 창을 닫지 말고 잠시만 기다려 주십시오",
      failure: "제출을 확인하지 못했습니다. 아래 세션 ID를 기록하고 연구자에게 문의해 주세요. 창을 닫거나 새로고침하지 말아 주세요.",
      blocked: "제출을 확인하지 못했습니다. 아래 세션 ID를 기록하고 연구자에게 문의해 주세요. 다시 제출하거나 창을 닫거나 새로고침하지 말아 주세요.",
      retryHelp: "인터넷 연결을 확인해 주세요. 5초 후 다시 제출할 수 있습니다.",
      reference: "세션 ID: ",
      retry: "다시 제출",
      download: "결과 ZIP 다운로드",
      recoveryHelp: "ZIP 파일을 다운로드한 뒤 ben701@kaist.ac.kr로 보내는 이메일에 첨부해 주세요. 위 세션 ID도 함께 알려 주세요. 다운로드는 온라인 제출 완료를 의미하지 않습니다.",
      recoveryFailure: "결과 ZIP 파일을 준비하지 못했습니다. 이 창을 열어 둔 채 위 세션 ID와 함께 ben701@kaist.ac.kr로 문의해 주세요.",
      success: "응답이 저장되었습니다. 참여해 주셔서 감사합니다."
    };

    let rows;
    try {
      rows = jsPsych.data.get().values();
      if (!Array.isArray(rows) || rows.some(row => row === null || typeof row !== "object")) {
        throw submissionError("SAVE_DATA_READ");
      }
    } catch (error) {
      jsPsych.getDisplayElement().textContent =
        text.failure + " " + text.reference + sessionId;
      submissionPromise = new Promise(() => {});
      return submissionPromise;
    }
    const finalRow = rows[rows.length - 1];

    // abortExperiment() also triggers initJsPsych's on_finish.
    // Submit only consented sessions that completed the debrief.
    const consented = rows.some(
      row => row.task === "consent" && row.consented === true
    );
    if (
      !consented ||
      finalRow?.task !== "debrief" ||
      finalRow.debrief_acknowledged !== true
    ) {
      return;
    }

    let resolveSubmission;
    submissionPromise = new Promise(resolve => { resolveSubmission = resolve; });
    const display = jsPsych.getDisplayElement();
    // Only the sending message is visible during preparation/upload.
    display.innerHTML = `
      <p id="save-status" role="status" aria-live="polite"></p>
      <p id="save-reference" hidden></p>
      <button id="save-retry" class="jspsych-btn" type="button" hidden></button>
      <a id="save-download" class="jspsych-btn" hidden></a>
      <p id="save-recovery-help" hidden></p>
    `;
    const status = display.querySelector("#save-status");
    const reference = display.querySelector("#save-reference");
    const retry = display.querySelector("#save-retry");
    const download = display.querySelector("#save-download");
    const recoveryHelp = display.querySelector("#save-recovery-help");
    status.textContent = text.sending;
    reference.textContent = text.reference + sessionId;
    retry.textContent = text.retry;
    download.textContent = text.download;

    const files = [];
    const baseName = `CCM_${experimentVersion}_${sessionId}`;
    let preparationCode = "SAVE_DATA_SERIALIZE";
    try {
      validateDataSavingConfig();
      // All five files use one snapshot. Exporting never modifies live rows.
      const snapshot = jsPsych.data.get().readOnly();
      const completedAt = new Date().toISOString();
      const metadata = {
        session_id: sessionId,
        experiment_version: experimentVersion,
        condition: experimentConfig.condition,
        sessions_completed: completedSessions,
        verification_skip_sessions: experimentConfig.skipSessionsForVerification,
        completed_at: completedAt
      };
      const dataString = JSON.stringify({
        ...metadata,
        trials: snapshot.values()
      });

      preparationCode = "SAVE_BIGFIVE_SERIALIZE";
      const bigFiveCsv = createBigFiveCsv(snapshot.values(), bigFiveDataset, metadata);

      preparationCode = "SAVE_GMSI_SERIALIZE";
      const gmsiCsv = createGmsiCsv(snapshot.values(), gmsiDataset, metadata);

      preparationCode = "SAVE_CSV_SERIALIZE";
      const csvString = createExperimentCsv(snapshot.values(), metadata);

      preparationCode = "SAVE_PROCEDURAL_SERIALIZE";
      const proceduralCsv = createProceduralCsv(snapshot.values(), metadata);

      // Prepare and size-check ALL immutable requests before sending any file.
      for (const [key, filename, data] of [
        ["JSON", baseName + ".json", dataString],
        ["CSV", baseName + ".csv", csvString],
        ["PROCEDURAL_CSV", baseName + "_procedural.csv", proceduralCsv],
        ["BIGFIVE_CSV", baseName + "_bigfive.csv", bigFiveCsv],
        ["GMSI_CSV", baseName + "_gmsi.csv", gmsiCsv]
      ]) {
        preparationCode = "SAVE_REQUEST_SERIALIZE";
        const requestBody = JSON.stringify({
          experimentID: dataSavingConfig.experimentID, filename, data
        });
        preparationCode = "SAVE_REQUEST_ENCODING";
        if (new TextEncoder().encode(requestBody).byteLength >= 32000000) {
          throw submissionError("SAVE_REQUEST_TOO_LARGE");
        }
        files.push({ key, filename, data, requestBody, state: "pending" });
      }
    } catch (error) {
      status.textContent = text.failure;
      reference.hidden = false;
      // Preserve a fixed diagnostic for researcher inspection without rendering it.
      display.dataset.submissionCode = error?.submissionCode || preparationCode;
      return submissionPromise;
    }

    let recoveryUrl = null;
    function showRecoveryDownload() {
      try {
        if (recoveryUrl === null) recoveryUrl = URL.createObjectURL(createResultsZip(files));
        download.href = recoveryUrl;
        download.download = baseName + ".zip";
        download.hidden = false;
        recoveryHelp.textContent = text.recoveryHelp;
        delete display.dataset.recoveryCode;
      } catch (error) {
        download.hidden = true;
        recoveryHelp.textContent = text.recoveryFailure;
        display.dataset.recoveryCode = "SAVE_ZIP_PREPARE";
      }
      recoveryHelp.hidden = false;
    }

    let state = "ready";
    async function submit() {
      // A single request at a time; terminal states cannot submit again.
      if (state !== "ready") return;
      state = "uploading";
      retry.hidden = true;
      retry.disabled = true;
      reference.hidden = true;
      download.hidden = true;
      recoveryHelp.hidden = true;
      delete display.dataset.submissionCode;
      delete display.dataset.submissionFile;
      delete display.dataset.submissionHttpStatus;
      delete display.dataset.recoveryCode;
      status.textContent = text.sending;

      let activeFile;
      try {
        // Stop at the first failure. A manual retry skips confirmed files.
        for (const file of files) {
          if (file.state === "saved") continue;
          activeFile = file;
          file.state = "uploading";
          await uploadCompletedSession(file.requestBody);
          file.state = "saved";
        }
        state = "saved";
        status.textContent = text.success;
        if (recoveryUrl !== null) {
          URL.revokeObjectURL(recoveryUrl);
          recoveryUrl = null;
        }
        resolveSubmission();
      } catch (error) {
        state = error?.submissionState || "rejected";
        if (activeFile) activeFile.state = state;
        reference.hidden = false;
        display.dataset.submissionCode = error?.submissionCode || "SAVE_UNEXPECTED";
        display.dataset.submissionFile = activeFile?.key || "UPLOAD";
        if (Number.isInteger(error?.httpStatus)) {
          display.dataset.submissionHttpStatus = String(error.httpStatus);
        }
        status.textContent = state === "queued" || state === "duplicate"
          ? text.blocked : text.failure;
        showRecoveryDownload();
        if (state === "unconfirmed") {
          status.textContent += " " + text.retryHelp;
          retry.hidden = false;
          // This timer only enables a button; it never sends another request.
          setTimeout(() => {
            state = "ready";
            retry.disabled = false;
          }, dataSavingConfig.retryDelayMs);
        }
      }
    }

    retry.addEventListener("click", submit);
    submit();
    return submissionPromise;
  }

  /* ------------------------------------------------------------------
     4. ASSEMBLE THE TIMELINE
     ------------------------------------------------------------------ */


  async function startExperiment() {
    try {
      if (location.protocol === "file:") {
        throw new Error("LOCAL_WEB_SERVER_REQUIRED");
      }
      await surveyStartup.stylesReady;
      if (surveyStartup.failed) throw new Error("SURVEY_STARTUP_FAILED");
      validateSessionConfiguration();
      [bigFiveDataset, gmsiDataset] = await Promise.all([loadBigFive(lang), loadGmsi(lang)]);
      if (!experimentConfig.skipSessionsForVerification) await selectSessionStimuli();
      retrievedConditionNumber = await retrieveConditionNumber();
      experimentConfig.condition = retrievedConditionNumber === 0
        ? "condition_1"
        : "condition_2";
      jsPsych.data.addProperties({ condition: experimentConfig.condition });

      timeline.push(
        ...buildConsentAndEligibility(),
        ...buildDemographics()
      );

      jsPsych.data.addProperties({
        verification_skip_sessions: experimentConfig.skipSessionsForVerification
      });
      if (!experimentConfig.skipSessionsForVerification) {
        timeline.push(
          ...buildHeadphoneCheckAndCalibration(),
          ...buildIntroductionAndPractice(),
          buildMainSession(1, experimentConfig.audioFiles),
          buildSecondSessionChoice(),
          {
            timeline: [buildMainSession(2, experimentConfig.secondSessionAudioFiles)],
            conditional_function: function () {
              return continueToSecondSession;
            }
          }
        );
      }

      timeline.push(
        ...buildParticipantQuestionnaires(),
        ...buildContactInformation(),
        ...buildDebrief()
      );

      /* ------------------------------------------------------------------
         5. RUN THE EXPERIMENT

         Leave this disabled until at least one trial has been added.
         ------------------------------------------------------------------ */

      await jsPsych.run(timeline);
    } catch (error) {
      surveyStartup.fail(sessionId);
      throw error;
    }
  }
